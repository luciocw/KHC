<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ultimate League KHC</title>
    <meta name="description" content="Classificação, top scorers, power ranking e lendas da Ultimate League KHC — fantasy football com acesso e rebaixamento.">
    <meta name="theme-color" content="#0E0C0B">

    <!-- Compartilhamento (WhatsApp, redes): URL absoluta da imagem -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ultimate League KHC">
    <meta property="og:title" content="Ultimate League KHC">
    <meta property="og:description" content="Sobe quem joga. Séries A a D, KHC Elite, acesso e rebaixamento — desde 2025.">
    <meta property="og:url" content="https://luciocw.github.io/KHC/">
    <meta property="og:image" content="https://luciocw.github.io/KHC/assets/banners/og-image-1200x630.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="assets/logo/svg/escudo-khc.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/logo/png/ui/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">

    <!-- App na tela inicial (Android: manifest · iPhone: meta apple-*) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KHC">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main" class="skip-link">Pular para o conteúdo</a>

    <header class="site-header">
        <div class="site-header__in">
            <a class="brand" href="#/ligas" aria-label="Ultimate League KHC — início">
                <img src="assets/logo/svg/escudo-khc.svg" alt="" width="32" height="36">
                <span><small>Ultimate League</small><b>KHC</b></span>
            </a>
            <!-- Abas (≥1024px). Geradas por renderShell() em js/app.js -->
            <nav class="top-tabs" id="topTabs" aria-label="Seções"></nav>
            <span class="spacer"></span>
            <div class="season-select" id="seasonSelect" role="radiogroup" aria-label="Temporada"></div>
            <a class="icon-btn only-mobile" id="rulesLink" href="#/regras" aria-label="Regras">
                <span data-icon="bookOpen" data-size="20"></span>
            </a>
        </div>
    </header>

    <main id="main" class="page" tabindex="-1">
        <div class="page-head">
            <div class="page-head__title">
                <div class="eyebrow" id="pageEyebrow"></div>
                <h1 class="display" id="pageTitle">Classificação</h1>
            </div>
            <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>
        <div id="view"></div>
    </main>

    <!-- Navegação inferior (<1024px). Gerada por renderShell() -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Seções"></nav>

    <!-- Perfil do jogador (lateral no desktop, bottom sheet no celular) -->
    <div class="scrim" id="scrim" data-close-drawer hidden></div>
    <aside id="player-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
        <div id="drawer-content"></div>
    </aside>

    <!--
        Módulos JS carregados em ordem de dependência (sem type="module";
        cada arquivo expõe funções no escopo global).

        1. config       → KHC_CONFIG, SERIES_META, constantes, appState
        2. sanitize     → escapeHtml, sanitize*
        3. api          → fetch+retry, cache, fetchLeagueData, fetchNflState
        4. data         → temporadas finalizadas (data/<ano>.json)
        5. derivations  → pwr, tier, lendas, carreira (puro, sem DOM)
        6. icons        → SVGs inline + renderIcons()
        7. ui/helpers   → avatar, botão de time, escudo, medalha, scroll lock
        8. ui/drawer    → perfil do jogador
           ui/export    → classificação, rodada e perfil como PNG
        9. tabs/*       → um render por aba (devolve HTML)
       10. app          → roteamento por hash, loadData, render
    -->
    <script src="js/config.js"></script>
    <script src="js/sanitize.js"></script>
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/derivations.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/ui/helpers.js"></script>
    <script src="js/ui/drawer.js"></script>
    <script src="js/ui/export.js"></script>
    <script src="js/tabs/ligas.js"></script>
    <script src="js/tabs/rodada.js"></script>
    <script src="js/tabs/top-scorers.js"></script>
    <script src="js/tabs/power-ranking.js"></script>
    <script src="js/tabs/lendas.js"></script>
    <script src="js/tabs/temporadas.js"></script>
    <script src="js/tabs/regras.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
