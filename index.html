<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate League KHC - Hub Oficial</title>
    <meta name="description" content="Hub oficial da Ultimate League KHC - Fantasy Football Brasil">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Skip link para acessibilidade -->
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

    <div class="watermark" aria-hidden="true"></div>

    <div class="container">
        <header role="banner">
            <div class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 96 110" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="khc-shield-fill" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#1a0c06"/>
                            <stop offset="100%" stop-color="#0a0503"/>
                        </linearGradient>
                        <radialGradient id="khc-ball-fill" cx="0.4" cy="0.35" r="0.75">
                            <stop offset="0%" stop-color="#ff8a4a"/>
                            <stop offset="100%" stop-color="#c84410"/>
                        </radialGradient>
                    </defs>
                    <!-- Outer shield -->
                    <path d="M48 4 L88 14 L88 56 C88 80 70 96 48 106 C26 96 8 80 8 56 L8 14 Z"
                          fill="url(#khc-shield-fill)" stroke="#ff6b35" stroke-width="2" stroke-linejoin="round"/>
                    <!-- Inner shield outline -->
                    <path d="M48 11 L82 19 L82 56 C82 76 66 90 48 99 C30 90 14 76 14 56 L14 19 Z"
                          fill="none" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.45" stroke-linejoin="round"/>
                    <!-- LEAGUE banner -->
                    <rect x="14" y="20" width="68" height="11" fill="#ff6b35"/>
                    <text x="48" y="28.5" text-anchor="middle" fill="#1a0c06"
                          font-family="Inter, sans-serif" font-size="9" font-weight="900"
                          letter-spacing="1.5">LEAGUE</text>
                    <!-- Football (rotated -22deg around its center) -->
                    <g transform="rotate(-22 48 58)">
                        <ellipse cx="48" cy="58" rx="20" ry="12" fill="url(#khc-ball-fill)"
                                 stroke="#7a2806" stroke-width="0.8"/>
                        <!-- Laces -->
                        <line x1="40" y1="58" x2="56" y2="58" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
                        <line x1="43" y1="55" x2="43" y2="61" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                        <line x1="46.5" y1="55" x2="46.5" y2="61" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                        <line x1="50" y1="55" x2="50" y2="61" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                        <line x1="53.5" y1="55" x2="53.5" y2="61" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                    </g>
                    <!-- Three stars -->
                    <g fill="#ff6b35">
                        <polygon points="32,78 33.2,81 36.4,81 33.8,82.9 34.8,86 32,84.1 29.2,86 30.2,82.9 27.6,81 30.8,81"/>
                        <polygon points="48,80 49.2,83 52.4,83 49.8,84.9 50.8,88 48,86.1 45.2,88 46.2,84.9 43.6,83 46.8,83"/>
                        <polygon points="64,78 65.2,81 68.4,81 65.8,82.9 66.8,86 64,84.1 61.2,86 62.2,82.9 59.6,81 62.8,81"/>
                    </g>
                    <!-- KHC text -->
                    <text x="48" y="100" text-anchor="middle" fill="#ff6b35"
                          font-family="Inter, sans-serif" font-size="11" font-weight="900"
                          letter-spacing="2">KHC</text>
                </svg>
            </div>
            <h1 class="brand-title">ULTIMATE KHC</h1>
            <p class="brand-subtitle">
                <span>Serie A</span>
                <span>Serie B</span>
                <span>Serie C</span>
                <span>Elite</span>
            </p>
        </header>

        <div class="controls">
            <div class="season-select">
                <label for="seasonSelector" class="sr-only">Selecionar temporada</label>
                <select id="seasonSelector" aria-label="Selecionar temporada">
                    <option value="2025">Temporada 2025 (Arquivo)</option>
                    <option value="2026" selected>Temporada 2026</option>
                </select>
            </div>

            <nav class="nav-tabs" role="tablist" aria-label="Navegação principal">
                <button
                    class="tab-btn active"
                    role="tab"
                    id="tab-btn-leagues"
                    aria-selected="true"
                    aria-controls="tab-leagues"
                    tabindex="0"
                    onclick="switchTab(event, 'leagues')">
                    <span class="tab-icon" data-icon="trophy" aria-hidden="true"></span>
                    <span class="tab-label">LIGAS</span>
                </button>
                <button
                    class="tab-btn"
                    role="tab"
                    id="tab-btn-global"
                    aria-selected="false"
                    aria-controls="tab-global"
                    tabindex="-1"
                    onclick="switchTab(event, 'global')">
                    <span class="tab-icon" data-icon="target" aria-hidden="true"></span>
                    <span class="tab-label">TOP SCORERS</span>
                </button>
                <button
                    class="tab-btn"
                    role="tab"
                    id="tab-btn-power"
                    aria-selected="false"
                    aria-controls="tab-power"
                    tabindex="-1"
                    onclick="switchTab(event, 'power')">
                    <span class="tab-icon" data-icon="chart" aria-hidden="true"></span>
                    <span class="tab-label">POWER RANKING</span>
                </button>
                <button
                    class="tab-btn"
                    role="tab"
                    id="tab-btn-legends"
                    aria-selected="false"
                    aria-controls="tab-legends"
                    tabindex="-1"
                    onclick="switchTab(event, 'legends')">
                    <span class="tab-icon" data-icon="columns" aria-hidden="true"></span>
                    <span class="tab-label">LENDAS KHC</span>
                </button>
                <button
                    class="tab-btn"
                    role="tab"
                    id="tab-btn-seasons"
                    aria-selected="false"
                    aria-controls="tab-seasons"
                    tabindex="-1"
                    onclick="switchTab(event, 'seasons')">
                    <span class="tab-icon" data-icon="calendar" aria-hidden="true"></span>
                    <span class="tab-label">TEMPORADAS</span>
                </button>
            </nav>
        </div>

        <main id="main-content">
            <section
                id="tab-leagues"
                class="view-section active"
                role="tabpanel"
                aria-labelledby="tab-btn-leagues"
                tabindex="0">
                <h2 class="sr-only">Classificação das Ligas</h2>
                <div id="leaguesContainer" class="leagues-grid" aria-live="polite">
                </div>
            </section>

            <section
                id="tab-global"
                class="view-section"
                role="tabpanel"
                aria-labelledby="tab-btn-global"
                tabindex="0"
                hidden>
                <h2 class="sr-only">Ranking Global - Top Scorers</h2>
                <div class="global-table" role="table" aria-label="Ranking global de pontuação">
                    <div class="global-header" role="row">
                        <div role="columnheader" aria-label="Posição">#</div>
                        <div role="columnheader">Time</div>
                        <div role="columnheader">Liga</div>
                        <div role="columnheader" style="text-align:right">Pts</div>
                    </div>
                    <div id="globalContainer" role="rowgroup" aria-live="polite">
                    </div>
                </div>
            </section>

            <section
                id="tab-power"
                class="view-section"
                role="tabpanel"
                aria-labelledby="tab-btn-power"
                tabindex="0"
                hidden>
                <h2 id="power-heading" class="sr-only">Power Ranking - Tier List</h2>
                <div class="power-intro">
                    <span class="power-intro-icon" aria-hidden="true">📊</span>
                    <span>Tier List baseada na pontuação total da temporada</span>
                </div>
                <div id="powerContainer" class="power-container" aria-labelledby="power-heading" aria-live="polite">
                </div>
            </section>

            <section
                id="tab-legends"
                class="view-section"
                role="tabpanel"
                aria-labelledby="tab-btn-legends"
                tabindex="0"
                hidden>
                <h2 class="sr-only">Lendas KHC - Ranking de Conquistas</h2>
                <div id="legendsContainer" class="legends-container" aria-label="Ranking de lendas por conquistas" aria-live="polite">
                </div>
            </section>

            <section
                id="tab-seasons"
                class="view-section"
                role="tabpanel"
                aria-labelledby="tab-btn-seasons"
                tabindex="0"
                hidden>
                <h2 class="sr-only">Temporadas - Resultados por Ano</h2>
                <div id="seasonsContainer" class="seasons-container" aria-label="Resultados por temporada" aria-live="polite">
                </div>
            </section>
        </main>

        <!-- FOOTER MOUNT — Fase 4.B injeta o <footer> aqui (dentro do .container). -->

    </div>

    <aside id="player-drawer" class="drawer drawer--player" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
        <div class="drawer-backdrop" data-close-drawer></div>
        <div class="drawer-panel" role="document">
            <button class="drawer-close" type="button" aria-label="Fechar perfil" data-close-drawer>
                <!-- close icon will be rendered by drawer.js or via IconRegistry on open -->
            </button>
            <div class="drawer-content" id="drawer-content">
                <!-- Populated by openPlayerDrawer() -->
            </div>
        </div>
    </aside>

    <!-- MODAL MOUNT — Fase 4.B injeta o about modal aqui (fora do .container). -->

    <!--
        Módulos JS carregados em ordem de dependência.
        Padrão vanilla (sem type="module"): cada arquivo expõe funções no
        escopo global; ordem de carregamento garante disponibilidade.

        1. config       → constantes, KHC_CONFIG, appState
        2. sanitize     → escapeHtml, sanitize*
        3. api          → fetch+retry, cache, fetchLeagueData
        4. data         → loader híbrido (JSON estático + Sleeper live)
        5. derivations  → pwr, tier, legends, career (puro, sem DOM)
        6. icons        → SVG icon registry + renderIcons() (hidrata data-icon)
        7. ui/loading   → spinners, skeletons
        8. ui/tabs      → switchTab (usado inline), keyboard nav, SR
        9. ui/drawer    → player drawer (side-sheet)
       10. ui/modal     → about modal
       11. tabs/*       → renderers por aba
       12. app          → init, loadData, DOMContentLoaded
    -->
    <script src="js/config.js"></script>
    <script src="js/sanitize.js"></script>
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/derivations.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/ui/loading.js"></script>
    <script src="js/ui/tabs.js"></script>
    <script src="js/ui/drawer.js"></script>
    <script src="js/ui/modal.js"></script>
    <script src="js/tabs/ligas.js"></script>
    <script src="js/tabs/top-scorers.js"></script>
    <script src="js/tabs/power-ranking.js"></script>
    <script src="js/tabs/lendas.js"></script>
    <script src="js/tabs/temporadas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
