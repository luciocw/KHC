<!doctype html>
<html lang="pt-BR">
<head>

<style>

.g-title { position: absolute; left: 0; right: 0; top: 205px; text-align: center; font-weight: 900; font-style: italic; font-size: 70px; color: var(--gold); text-shadow: 5px 5px 0 #000; }

.dc-h.ok { color: var(--success); } .dc-h.no { color: #ff6b5e; }
.dc-r { display: grid; grid-template-columns: 70px 1fr 170px; align-items: center; gap: 16px; height: 88px; padding: 0 20px; border-radius: 16px;
    background: rgba(22,19,17,.94); border: 2px solid #2a2420; opacity: 0; }
.dc-r .av { width: 64px; height: 64px; border-radius: 14px; }
.dc-r .n b { font-weight: 800; font-size: 38px; } .dc-r .n span { font-family: Mono; font-size: 22px; color: var(--text-3); margin-left: 10px; }
.dc-r .tag { font-family: Pixel; font-size: 18px; text-align: center; padding: 10px 8px; border-radius: 6px; }
.dc-r.ok { border-color: var(--success); } .dc-r.ok .tag { background: var(--success); color: #05210f; }
.dc-r.no { border-color: var(--danger); } .dc-r.no .tag { background: var(--danger); color: #fff; }
.dc-none { font-weight: 900; font-size: 52px; color: #fff; padding: 20px 24px; border-radius: 18px; border: 3px dashed var(--danger); background: rgba(235,64,52,.08); opacity: 0; }

/* quase lá: zonas */
.zz { position: absolute; left: 44px; right: 44px; top: 480px; display: flex; flex-direction: column; gap: 46px; }
.zz-g { opacity: 0; }
.zz-g .hd { display: flex; align-items: center; gap: 14px; font-family: Mono; font-size: 28px; letter-spacing: 3px; margin: 0 0 8px 4px; }

/* parabéns, Ditador */
.pz-bg { position: absolute; inset: 0; background: radial-gradient(900px 800px at 50% 35%, rgba(242,183,5,.28), #0b0905 75%); }
.pz-band { position: absolute; left: -40px; right: -40px; top: 230px; height: 110px; background: linear-gradient(90deg, #8a6a00, #F2B705, #8a6a00);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 56px; letter-spacing: 4px; color: #1a1208; transform: rotate(-2deg); }

<body>
<div id="stage"></div>
<div id="fx"></div>
<script src="../engine.js"></script>
<script>
(async () => {
const data = await (await fetch('data.json')).json();
const G = await (await fetch('guilhotina.json')).json();
const A = await (await fetch('tambem.json')).json();
const { el, set, prog, lerp, ease, enter, blink, shake, LEAGUE } = KHC;
LEAGUE.nba = { color: '#7A1F3D', crest: '../../assets/logo/png/ui/escudo-nba.png' };
LEAGUE.premier = { color: '#D4A017', crest: '../../assets/logo/png/ui/escudo-premier.png' };
const ALL = data.leagues.flatMap(l => l.matchups.flat().map(t => ({ ...t, tier: l.tier })));
const T = (name, tier) => ALL.find(t => t.name.trim() === name && (!tier || t.tier === tier)) || {};
const pts = (n, tier) => T(n, tier).points;
const rec = (n, tier) => T(n, tier).record.replace('-', '–');
const GT = n => G.teams.find(t => t.name === n);
const PT = n => A.premier.teams.find(t => t.name === n);
const br = v => v.toFixed(2).replace('.', ',');
const W11 = G.weeks[G.weeks.length - 1];
const DEC = await (await fetch('decididos.json')).json();

// ------------------------------------------------------------ helpers locais
function head(root, n, title, px, cls = '') {
    KHC.hud(root, 'KHC AWARDS · S11', []);
    const a = el('div', 'award ' + cls, root);
    el('div', 'n', a, `PRÊMIO Nº ${String(n).padStart(2, '0')}`);
    const t = el('div', 't', a, title);
    const p = el('div', 'px', a, px);
    return { a, t, p };
}
function drawHead(h, lt) {
    const p = enter(lt, .1, .45, ease.back);
    set(h.t, { o: Math.min(1, p * 2), x: (1 - p) * -200 });
    set(h.p, { o: lt > .4 ? (lt < 1.2 ? blink(lt, .15) : 1) : 0 });
}
function row(parent, name, tier, sub, value, cls = '') {
    const r = KHC.teamRow(parent, { name, avatar: T(name, tier).avatar, sub, value });
    if (cls) r.row.classList.add(...cls.split(' '));
    return r;
}
function slideIn(r, t, a, from = 1100) { const p = enter(t, a, .35); set(r.row, { o: Math.min(1, p * 1.6), x: (1 - p) * from }); }
function count(elm, t, a, b, v, digits = 2) { elm.textContent = (v * ease.out(prog(t, a, b))).toFixed(digits); }

/** Prêmio de 4 s com dois times: entram (+.35), placares (+.4→1.2), selo (+1.4), legenda (+1.8). */
function duel(a, n, title, px, A1, B1, cfg) {
    KHC.scene(a, a + 4, root => {
        const s = root.s = {};
        s.h = head(root, n, title, px);
        const g = el('div', 'group', root); g.style.top = (cfg.top || 620) + 'px'; g.style.gap = '40px';
        s.a = row(g, ...A1); s.b = row(g, ...B1);
        s.st = KHC.stamp((cfg.stampOn === 'b' ? s.b : s.a).row, cfg.stamp, { top: -56, right: 24, rot: -3 });
        if (cfg.extra) cfg.extra(root, s);
        s.cap = KHC.caption(root, cfg.caption[0], cfg.caption[1]);
    }, (lt, t, root) => {
        const s = root.s;
        drawHead(s.h, lt);
        slideIn(s.a, t, a + .35); slideIn(s.b, t, a + .5, -1100);
        if (cfg.va !== undefined) count(s.a.val, t, a + .4, a + 1.2, cfg.va);
        if (cfg.vb !== undefined) count(s.b.val, t, a + .4, a + 1.2, cfg.vb);
        KHC.drawStamp(s.st, t, a + 1.4);
        if (cfg.drawExtra) cfg.drawExtra(t, s);
        KHC.drawCaption(s.cap, t, a + 1.8);
    });
}


// ================================================================ CENAS
const ROW = (n, tier) => ALL.find(t => t.name === n && (!tier || t.tier === tier)) || {};
// 0–3 · Abertura
KHC.scene(0, 3, root => {
    const s = root.s = {};
    s.logo = el('img', 'big-logo', root); s.logo.src = LEAGUE.khc.crest;
    s.px = el('div', 'awards-px', root, 'KHC AWARDS');
    s.l1 = el('div', 'open-l', root, 'Prêmios que'); s.l1.style.top = '800px';
    s.l2 = el('div', 'open-l', root, 'ninguém'); s.l2.style.top = '910px';
    s.l3 = el('div', 'open-l o', root, 'queria'); s.l3.style.top = '1020px';
    s.l4 = el('div', 'open-l o', root, 'ganhar.'); s.l4.style.top = '1130px';
    s.chip = el('div', 'week-chip', root, 'SEMANA 11');
    s.sub = el('div', 'open-sub', root, 'Faltavam 4. Agora faltam 3. Quem já está decidido?');
    s.boot = el('div', 'boot', root);
}, (lt, t, root) => {
    const s = root.s;
    const b = prog(lt, 0, .16);
    set(s.boot, { o: 1 - b, sy: lerp(.004, 1, ease.out(b)) });
    const lp = enter(lt, .05, .6, ease.elastic); set(s.logo, { s: lp, r: (1 - lp) * 20 });
    set(s.px, { o: lt < 1.2 ? blink(lt, .15) : 1 });
    [s.l1, s.l2, s.l3, s.l4].forEach((e, i) => { const p = enter(lt, .25 + i * .16, .35, ease.back); set(e, { o: Math.min(1, p * 2), y: (1 - p) * 80 }); });
    const c = enter(lt, 1.2, .3, ease.back); set(s.chip, { o: c, s: lerp(1.6, 1, c) });
    const sb = enter(lt, 1.7, .4); set(s.sub, { o: sb, y: (1 - sb) * 30 });
});

// 3–10 · Decididos com 100% de certeza (todos os 32.768 cenários das rodadas 12–14)
const LBL = { elite: 'Elite', 'serie-a': 'Série A', 'serie-b': 'Série B', 'serie-c': 'Série C', 'serie-d': 'Série D' };
KHC.scene(3, 10, root => {
    const s = root.s = {};
    KHC.hud(root, 'KHC AWARDS · S11', []);
    el('div', 'dc-k', root, 'MATEMATICAMENTE · 100% · FALTAM 3 RODADAS');
    el('div', 'dc-t', root, 'Já estão nos<br><span>playoffs</span>');
    const okList = [], noList = [];
    Object.entries(DEC).forEach(([tier, d]) => {
        d.classificados.forEach(n => okList.push([n, tier]));
        d.fora_dos_playoffs.forEach(n => noList.push([n, tier]));
    });
    const c1 = el('div', 'dc-col', root); c1.style.top = '520px';
    el('div', 'dc-h ok', c1, '✓ CLASSIFICADOS');
    const mk = (box, [n, tier], cls, tag) => {
        const tm = ROW(n, tier);
        const r = el('div', 'dc-r ' + cls, box);
        const av = el('div', 'av', r); el('img', '', av).src = tm.avatar;
        el('div', 'n', r, `<b>${KHC.esc(n)}</b><span>${LBL[tier]} · ${tm.record.replace('-', '–')}</span>`);
        el('div', 'tag', r, tag);
        return r;
    };
    s.ok = okList.map(x => mk(c1, x, 'ok', 'DENTRO'));
    const c2 = el('div', 'dc-col', root); c2.style.top = (560 + okList.length * 98 + 40) + 'px';
    el('div', 'dc-h no', c2, '✗ FORA DOS PLAYOFFS');
    s.no = noList.map(x => mk(c2, x, 'no', 'FORA'));
    s.none = el('div', 'dc-none', c2, 'Rebaixados: nenhum. Ainda.<small>mas o site já dá >99% para Gumagol971 e Kelce Gremista</small>');
    s.none.style.marginTop = '18px';
}, (lt, t, root) => {
    const s = root.s;
    [...s.ok, ...s.no].forEach((r, i) => { const e = enter(t, 3.5 + i * .25, .3); set(r, { o: e, x: (1 - e) * (i % 2 ? 900 : -900) }); });
    const n = enter(t, 3.5 + (s.ok.length + s.no.length) * .25 + .3, .35, ease.back); set(s.none, { o: n, s: lerp(1.4, 1, n) });
});

// 10–16 · Quase lá: as zonas de queda (chances do site após a rodada 11)
const ZONA = { 'serie-a': [['Caipiracicaba', 60], ['Diogoashura', 72], ['Cruzeiro do Neymar SFC', 96]],
               'serie-b': [['Ceará Dolphins', 98], ['wladspfc', 98], ['Gumagol971', 100]],
               'serie-c': [['WI Redentor', 90], ['romanerinha', 99], ['Kelce Gremista', 100]] };
KHC.scene(10, 16, root => {
    const s = root.s = {};
    KHC.hud(root, 'KHC AWARDS · S11', []);
    el('div', 'dc-k', root, 'CHANCE DE QUEDA · APÓS A RODADA 11');
    el('div', 'dc-t', root, 'Quase <span style="color:var(--danger)">lá</span>');
    const box = el('div', 'zz', root);
    s.g = Object.entries(ZONA).map(([tier, list]) => {
        const g = el('div', 'zz-g', box);
        g.innerHTML = `<div class="hd" style="color:${LEAGUE[tier].color}"><img src="${LEAGUE[tier].crest}">${LBL[tier].toUpperCase()}</div>`;
        const r = el('div', 'zz-row', g);
        list.forEach(([n, q]) => el('div', 'zz-c', r, `<img src="${ROW(n, tier).avatar}"><div><b>${KHC.esc(n)}</b><i>${q >= 100 ? '>99' : q}%</i></div>`));
        return g;
    });
    s.st = KHC.stamp(root, '9 na zona · nenhum garantido', { top: 1330, right: 60, rot: -2 }); s.st.style.fontSize = '38px';
    s.cap = KHC.caption(root, 'Três rodadas. Nove pescoços.', 'A matemática ainda deixa sonhar.');
    s.cap.c.style.top = '1450px';
}, (lt, t, root) => {
    const s = root.s;
    s.g.forEach((g, i) => { const e = enter(t, 10.4 + i * .3, .35); set(g, { o: e, x: (1 - e) * (i % 2 ? 900 : -900) }); });
    KHC.drawStamp(s.st, t, 11.8);
    KHC.drawCaption(s.cap, t, 12.2);
});

// 16–20 · Semana para Esquecer: Diogoashura perdeu por 107 na Elite e por 90 na A
duel(16, 2, 'Semana para Esquecer', 'DIOGOASHURA · ELITE E SÉRIE A',

    { va: pts('Diogoashura', 'elite'), vb: pts('Diogoashura', 'serie-a'),
      stamp: '72% de queda na A', caption: ['64 na Elite, 100 na Série A.', 'Duas surras no mesmo fim de semana.'] });

// 20–24 · Foto-chegada: RegisCarrara × alb2106 por 0,60
duel(20, 3, 'Foto-chegada', 'SÉRIE B · DIFERENÇA DE 0,60',
    ['RegisCarrara', 'serie-b', `líder · ${rec('RegisCarrara', 'serie-b')} · classificado`, '0.00', 'win'],
    ['alb2106', 'serie-b', `perdeu · ${rec('alb2106', 'serie-b')}`, '0.00', 'lose'],
    { va: pts('RegisCarrara', 'serie-b'), vb: pts('alb2106', 'serie-b'), stampOn: 'b',
      stamp: 'Perdeu por 0,60', caption: ['153,86 × 153,26.', 'O líder carimbou a vaga por um fio.'] });

const BLADE = `<svg viewBox="0 0 1000 200" preserveAspectRatio="none"><rect x="470" y="0" width="60" height="40" fill="#2b2724"/>
  <polygon points="0,30 1000,30 1000,110 0,200" fill="#6d6762"/><polygon points="0,182 1000,96 1000,110 0,200" fill="#B3121B"/></svg>`;
function sliced(parent, fill) {
    const s = el('div', 'slot', parent);
    const top = el('div', 'half top', s), bot = el('div', 'half bot', s);
    fill(top); fill(bot);
    const line = el('div', 'cutl', s);
    const bl = el('div', 'blade', s, BLADE); bl.style.top = '-130px';
    return { s, top, bot, line, bl };
}
function drawSlice(sl, t, a) {
    const p = enter(t, a, .3, ease.back), g = prog(t, a, a + .3);
    const f = `grayscale(${g}) brightness(${1 - .4 * g})`;
    set(sl.top, { x: -p * 16, y: -p * 10, r: -p * 1.2, f }); set(sl.bot, { x: p * 16, y: p * 10, r: p * 1.4, f });
    sl.line.style.opacity = t < a - .08 ? 0 : 1 - prog(t, a + .05, a + .45);
    sl.line.style.transform = `rotate(-1.4deg) scaleX(${prog(t, a - .08, a)})`;
    const d = ease.inOut(prog(t, a - .2, a)), up = prog(t, a + .1, a + .45);
    set(sl.bl, { o: t < a - .2 || t > a + .45 ? 0 : 1 - up, y: lerp(-800, 0, d) - up * 60 });
}
// 24–29 · Guilhotina · rodada 11
KHC.scene(24, 29, root => {
    const s = root.s = {};
    el('div', 'redbg', root);
    s.h = head(root, 4, 'Guilhotina', `RODADA 11 · ${G.alive} VIVOS`, 'red');
    const g = el('div', 'group', root); g.style.top = '600px'; g.style.gap = '0';
    const cut = GT(W11.cut);
    s.cut = sliced(g, h => { const r = KHC.teamRow(h, { name: cut.name, avatar: cut.avatar, sub: 'o nome já avisava', value: br(W11.cut_pts) }); r.row.classList.add('lose'); });
    s.rip = el('div', 'rip', s.cut.s, 'CORTADO');
    s.roast = el('div', 'roast', g, 'Condenado. Literalmente.');
    const esc = W11.escaped[0];
    s.esc = KHC.teamRow(g, { name: esc.name, avatar: GT(esc.name).avatar, sub: `escapou por ${br(esc.pts - W11.cut_pts)}`, value: br(esc.pts) });
    s.esc.row.classList.add('hot');
    s.st = KHC.stamp(s.esc.row, 'Restam 12', { top: -56, right: 24, rot: -3 });
    s.fl = el('div', 'flash', root);
    s.cap = KHC.caption(root, 'A Guilhotina não lê o nome do time.', 'Mas dessa vez ele avisou.');
}, (lt, t, root) => {
    const s = root.s;
    drawHead(s.h, lt);
    const e = enter(t, 24.4, .35); set(s.cut.s, { o: Math.min(1, e * 1.6), x: (1 - e) * -1100 });
    drawSlice(s.cut, t, 25.3);
    const q = enter(t, 25.35, .2); set(s.rip, { o: q, s: lerp(2, 1, q), r: -6 });
    const r = enter(t, 25.6, .35, ease.back); set(s.roast, { o: r, s: lerp(1.4, 1, r) });
    slideIn(s.esc, t, 26.0);
    KHC.drawStamp(s.st, t, 26.5);
    s.fl.style.opacity = t >= 25.3 ? .55 * (1 - prog(t, 25.3, 25.6)) : 0;
    const [x, y] = shake(t, 25.3, .3, 16); root.style.transform = `translate(${x}px, ${y}px)`;
    KHC.drawCaption(s.cap, t, 26.9);
});

// 29–35 · PARABÉNS, DITADOR! Vice na Cocoricó (no desempate)
KHC.scene(29, 35, root => {
    const s = root.s = {};
    el('div', 'pz-bg', root);
    s.conf = Array.from({ length: 40 }, (_, i) => { const c = el('div', 'conf', root); c.style.left = ((i * 97) % 1080) + 'px'; c.style.background = ['#F2B705', '#fff', '#F26A1B', '#3DD68C'][i % 4]; return c; });
    KHC.hud(root, 'KHC AWARDS · S11', []);
    s.band = el('div', 'pz-band', root, 'HOMENAGEM OFICIAL DA KHC');
    s.t = el('div', 'pz-t', root, 'Parabéns, Ditador!');
    const nl = PT('North London Dictator');
    s.who = el('div', 'pz-who', root, `<img src="${nl.avatar}"><div><b>North London Dictator</b><span>2º LUGAR · COCORICÓ PL</span></div>`);
    const top = A.premier.teams.slice(0, 4);
    s.tbl = el('div', 'pz-tbl', root, top.map((x, i) => `<div class="${x.name === nl.name ? 'me' : ''}"><span>${i + 1}º</span><span>${KHC.esc(x.name)}</span><span>${x.w}–${x.t}–${x.l}</span></div>`).join(''));
    s.st = KHC.stamp(root, '*empatado com mais dois. Vice no desempate.', { top: 970, right: 60, rot: -2 }); s.st.style.fontSize = '30px';
    s.cap = el('div', 'pz-cap', root, 'Para um torcedor do Tottenham,<br>é praticamente um título.');
    s.medal = el('div', 'pz-medal', root, '<div class="r"></div><div class="m">2</div>');
    s.dec = el('div', 'pz-dec', root, 'Henrique I decreta:<br>vice agora conta como título.<small>Mesmo faltando 27 rodadas.</small>');
}, (lt, t, root, wall) => {
    const s = root.s;
    s.conf.forEach((c, i) => { c.style.transform = `translateY(${((wall * 500 + i * 211) % 2000) - 100}px) rotate(${wall * 300 + i * 40}deg)`; c.style.opacity = lt < 4.6 ? .9 : 0; });
    const b = enter(lt, .05, .35, ease.back); set(s.band, { o: b, sx: lerp(1.5, 1, b), r: -2 });
    const p = enter(lt, .3, .4, ease.back); set(s.t, { o: Math.min(1, p * 2), s: lerp(1.6, 1, p) });
    const w = enter(lt, .6, .35); set(s.who, { o: w, y: (1 - w) * 60 });
    set(s.tbl, { o: enter(lt, 1.2, .3) });
    KHC.drawStamp(s.st, t, 30.6);
    // a medalha sobe e trava no meio do caminho
    const up = ease.out(prog(lt, 1.0, 1.7)), stuck = lt > 1.7 ? Math.sin(wall * 40) * 4 * (1 - prog(lt, 1.7, 2.1)) : 0;
    set(s.medal, { y: lerp(600, 0, up) + stuck, o: lt > .9 ? 1 : 0 });
    const c = enter(lt, 2.0, .35); set(s.cap, { o: c, y: (1 - c) * 30 });
    const d = enter(lt, 3.4, .35, ease.back); set(s.dec, { o: Math.min(1, d * 2), s: lerp(1.5, 1, d) });
});

// 35–39 · NBA: a vaca segue em cima da árvore
KHC.scene(35, 39, root => {

    s.h = head(root, 6, 'A Vaca Segue na Árvore', `KHC NBA · APÓS A RODADA ${A.nba.week}`);
    const nb = A.nba.teams;

    const cr = nb.find(x => x.name === 'Cruise Basketball'), pe = nb.find(x => x.name === 'Public Enemy #1');
    s.a = KHC.teamRow(g, { name: cr.name, avatar: cr.avatar, sub: 'único invicto · a vaca segue lá em cima', value: `${cr.w}–${cr.l}` }); s.a.row.classList.add('win');
    s.b = KHC.teamRow(g, { name: pe.name, avatar: pe.avatar, sub: 'perdeu a invencibilidade', value: `${pe.w}–${pe.l}` }); s.b.row.classList.add('lose');
    s.st = KHC.stamp(s.a.row, '5–0 e nada de cair', { top: -56, right: 24, rot: -3 });
    s.cap = KHC.caption(root, 'O satanás caiu primeiro.', 'A vaca segue em cima da árvore.');
}, (lt, t, root) => {
    const s = root.s;
    drawHead(s.h, lt);
    slideIn(s.a, t, 35.35); slideIn(s.b, t, 35.5, -1100);
    KHC.drawStamp(s.st, t, 36.0);
    KHC.drawCaption(s.cap, t, 36.4);
});

// 39–43 · Fim: gancho para a Prévia S12 e o aviso da Copa KHC 2027
KHC.scene(39, 43, root => {
    const s = root.s = {};
    KHC.hud(root, 'KHC AWARDS · S11', []);
    s.k = el('div', 'end-k', root, 'PRÉVIA · SEMANA 12');
    s.l1 = el('div', 'end-1', root, 'Faltam 3.');
    s.l2 = el('div', 'end-2', root, 'Quem ainda<br>escapa?');
    s.copa = el('div', 'copa', root, 'Já decidido? <b>Segue escalando.</b><br>Em 2027 tem <b>Copa KHC</b>.');
    s.logo = el('img', 'end-logo', root); s.logo.src = LEAGUE.khc.crest; s.logo.style.top = '1560px';
}, (lt, t, root) => {
    const s = root.s;
    set(s.k, { o: enter(t, 39.1, .3) });
    const a = enter(t, 39.3, .4, ease.back); set(s.l1, { o: Math.min(1, a * 2), y: (1 - a) * 80 });
    const b = enter(t, 39.9, .3, ease.back); set(s.l2, { o: b > 0 ? 1 : 0, s: lerp(1.8, 1, b), r: (1 - b) * -8 });
    const c = enter(t, 40.5, .35, ease.back); set(s.copa, { o: c, s: lerp(1.3, 1, c) });
    const l = enter(t, 41.2, .5, ease.elastic); set(s.logo, { s: l });
});

[[3, 'khc'], [10, 'serie-a'], [16, 'elite'], [20, 'serie-b'], [24, 'guilhotina'], [29, 'khc'], [35, 'khc'], [39, 'khc']]
    .forEach(([p, lg]) => KHC.wipe(p, lg));
KHC.fadeOut(42.55, 43);

// Pausas de leitura (tempo da timeline, duração). A mesma lista está em
// scripts/trilha/awards11.py.
KHC.hold([[9.0, 1.4], [15.0, 1.2], [19.4, 0.6], [23.4, 0.6], [28.4, 0.6], [34.4, 1.2], [38.4, 0.6], [42.3, 0.6]]);

KHC.start(43);
await window.ready();
window.loaded = true;
})();
