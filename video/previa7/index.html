<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KHC Prévia · Semana 7</title>
<link rel="stylesheet" href="../engine.css">
<style>
:root { --blood: #B3121B; --gold: #F2B705; }
.boot { position: absolute; inset: 0; background: #fff; transform-origin: center; }
.big-logo { position: absolute; left: 50%; top: 230px; width: 380px; height: 380px; margin-left: -190px; object-fit: contain;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.6)); }
.press { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-family: Pixel; font-size: 40px; color: var(--gold); text-shadow: 5px 5px 0 #000; }
.open-l { position: absolute; left: 60px; right: 60px; font-weight: 900; font-size: 120px; line-height: .95; letter-spacing: -2px; text-transform: uppercase; }
.open-l.o { color: var(--orange); }
.open-sub { position: absolute; left: 60px; right: 60px; top: 1260px; font-weight: 700; font-size: 56px; line-height: 1.1; color: var(--text-2); }
.open-sub b { color: var(--orange); }

.colhead { position: absolute; left: 76px; right: 76px; top: 440px; display: flex; justify-content: space-between;
    font-family: Mono; font-size: 24px; color: var(--text-3); letter-spacing: 2px; }
.rec .q, .tsub .q { color: var(--danger); }
.rec .nick { color: var(--gold); }
.pts.hi { color: var(--success); } .pts.lo { color: #8a7d73; }
.world { font-family: Mono !important; font-size: 30px !important; letter-spacing: 3px; }

/* rivalidade máxima: tela de luta */
.fight { position: absolute; inset: 0; background: radial-gradient(900px 700px at 50% 45%, rgba(59,130,246,.28), transparent 70%); }
.rv-k { position: absolute; left: 0; right: 0; top: 225px; text-align: center; font-weight: 900; font-size: 84px; letter-spacing: -1px; font-style: italic; color: var(--gold); text-shadow: 6px 6px 0 #000; }
.rv-sub { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-family: Mono; font-size: 30px; letter-spacing: 3px; color: var(--text-2); }
.fighter { position: absolute; top: 400px; width: 470px; text-align: center; }
.fighter.l { left: 40px; } .fighter.r { right: 40px; }
.fighter img { width: 300px; height: 300px; border-radius: 40px; object-fit: cover; border: 8px solid #fff; box-shadow: 0 30px 60px rgba(0,0,0,.6); }
.fighter .nm { font-weight: 900; font-size: 52px; line-height: 1; margin-top: 26px; white-space: nowrap; }
.fighter .rc { font-family: Mono; font-size: 34px; color: var(--text-2); margin-top: 10px; }
.fighter .rc b { color: var(--gold); }
.vsbig { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-family: Pixel; font-size: 110px; color: var(--orange);
    text-shadow: 8px 8px 0 #000; }
.bars { position: absolute; left: 50px; right: 50px; top: 1000px; display: flex; flex-direction: column; gap: 22px; }
.bar { display: grid; grid-template-columns: 150px 1fr 230px 1fr 150px; align-items: center; gap: 12px; }
.bar .v { font-family: Mono; font-size: 40px; color: var(--text); text-align: center; }
.bar .lb { font-family: Mono; font-size: 24px; letter-spacing: 2px; color: var(--text-3); text-align: center; }
.bar .tk { height: 30px; border-radius: 6px; background: #1d1916; overflow: hidden; display: flex; }
.bar .tk.l { justify-content: flex-end; }
.bar .tk i { display: block; height: 100%; width: 0; }
.bar .tk.l i { background: var(--orange); } .bar .tk.r i { background: #3B82F6; }
.bar .v.win { color: var(--success); }

/* guilhotina */
.redbg { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 50% -5%, rgba(179,18,27,.35), transparent 65%); }
.g-k { position: absolute; left: 60px; top: 240px; font-family: Mono; font-size: 32px; letter-spacing: 3px; color: var(--gold); }
.g-t { position: absolute; left: 60px; right: 270px; top: 300px; font-weight: 900; font-size: 100px; line-height: .95; letter-spacing: -2px; color: var(--blood); text-transform: uppercase; }
.g-crest { position: absolute; right: 60px; top: 230px; width: 190px; height: 220px; object-fit: contain; }
.blade { position: absolute; left: 50px; width: 980px; height: 190px; z-index: 4; }
.blade svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
.rope { position: absolute; left: 536px; top: 0; width: 8px; background: #8c6a43; z-index: 3; }

/* também na KHC */
.also-k { position: absolute; left: 60px; top: 240px; font-family: Mono; font-size: 32px; letter-spacing: 3px; color: var(--gold); }
.also-t { position: absolute; left: 60px; right: 300px; top: 300px; font-weight: 900; font-size: 100px; line-height: .95; letter-spacing: -2px; text-transform: uppercase; }
.also-crest { position: absolute; right: 60px; top: 240px; width: 210px; height: 230px; object-fit: contain; }
.grid8 { position: absolute; left: 50px; right: 50px; top: 600px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.cell { text-align: center; }
.cell img { width: 200px; height: 200px; border-radius: 30px; object-fit: cover; border: 4px solid #3A322C; }
.cell div { font-weight: 800; font-size: 30px; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.own img { border-color: var(--danger); }
.ghost { position: absolute; left: 50px; right: 50px; top: 1190px; height: 150px; display: flex; align-items: center; gap: 26px; padding: 0 30px;
    border: 4px dashed var(--danger); border-radius: 24px; background: rgba(235,64,52,.08); }
.ghost .q { width: 100px; height: 100px; border-radius: 22px; background: #1d1916; display: flex; align-items: center; justify-content: center;
    font-family: Pixel; font-size: 56px; color: var(--danger); }
.ghost .nm { font-weight: 900; font-size: 46px; } .ghost .sb { font-family: Mono; font-size: 28px; color: var(--text-3); margin-top: 6px; }
.lbl { font-family: Mono; font-size: 28px; letter-spacing: 3px; margin: 0 0 4px 6px; }
.lbl.bad { color: var(--danger); } .lbl.good { color: var(--success); } .lbl.gold { color: var(--gold); }
.group { position: absolute; left: 50px; right: 50px; display: flex; flex-direction: column; gap: 14px; }
.trow.win { border-color: var(--success); } .trow.lose { border-color: var(--danger); } .trow.hot { border-color: var(--orange); }

/* plantão do dossiê */
.tv { position: absolute; inset: 0; background: radial-gradient(900px 700px at 50% 40%, #2a0a0a, #050505 75%); transform-origin: center; }
.live { position: absolute; left: 50px; top: 90px; font-family: Mono; font-size: 34px; letter-spacing: 4px; color: #fff; background: var(--danger);
    padding: 12px 22px; border-radius: 8px; }
.live i { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: #fff; margin-right: 14px; vertical-align: -2px; }
.news-h { position: absolute; left: 50px; right: 30px; top: 200px; font-weight: 900; font-size: 82px; line-height: .95; letter-spacing: -2px;
    text-transform: uppercase; color: #fff; transform-origin: left center; }
.news-h span { color: var(--gold); }
.strike { position: absolute; left: -6px; top: 186px; height: 16px; width: 0; max-width: 400px; background: var(--danger); transform: rotate(-3deg); }
.news-card { position: absolute; left: 60px; top: 450px; width: 470px; height: 665px; border-radius: 16px; box-shadow: 0 30px 70px rgba(0,0,0,.8); }
.news-tag { position: absolute; left: 330px; top: 440px; font-family: Mono; font-size: 26px; letter-spacing: 3px; color: #1a1208; background: var(--gold);
    padding: 8px 14px; border-radius: 6px; }
.secrets { position: absolute; left: 560px; right: 40px; top: 600px; display: flex; flex-direction: column; gap: 34px; }
.sec { position: relative; font-weight: 800; font-size: 44px; line-height: 1.08; color: #fff; }
.redact { position: absolute; left: -8px; top: -4px; bottom: -4px; width: 0; background: #000; border-radius: 4px; box-shadow: 0 0 0 2px #222; }
.cens2 { position: absolute; left: -80px; right: -80px; top: 700px; height: 250px; display: flex; align-items: center; justify-content: center;
    background: var(--danger); color: #fff; font-weight: 900; font-size: 128px; letter-spacing: 6px; border-top: 14px solid #000; border-bottom: 14px solid #000;
    box-shadow: 0 30px 80px rgba(0,0,0,.8); opacity: 0; z-index: 5; }
.why2 { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-weight: 900; font-size: 100px; letter-spacing: -2px; color: #fff;
    text-shadow: 6px 6px 0 var(--danger); opacity: 0; z-index: 6; }
.ticker { position: absolute; left: 0; right: 0; top: 1700px; height: 90px; background: var(--gold); overflow: hidden; }
.ticker .tk { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 900; font-size: 50px; line-height: 90px; color: #120a05; }
.tv .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 3px, transparent 3px 7px); pointer-events: none; }
.poster { position: absolute; left: 100px; right: 100px; top: 360px; padding: 50px 40px 60px; text-align: center; background: #e9dfc6; color: #1a1208;
    border-radius: 6px; box-shadow: 0 40px 80px rgba(0,0,0,.7); opacity: 0; }
.poster .ph { font-weight: 900; font-size: 82px; letter-spacing: 1px; color: var(--blood); border-bottom: 6px solid #1a1208; padding-bottom: 14px; }
.poster img { width: 380px; height: 380px; margin: 40px auto 20px; display: block; object-fit: cover; filter: grayscale(1) sepia(.35) contrast(1.15); border: 10px solid #1a1208; }
.poster .pn { font-weight: 800; font-size: 56px; line-height: 1.05; }
.poster .pn b { font-weight: 900; font-size: 74px; }
.poster .pw { font-family: Mono; font-size: 32px; margin-top: 22px; color: #4a3a20; }
.poster .pq { font-weight: 900; font-size: 92px; margin-top: 24px; color: var(--blood); }
/* censurado */
.cens { position: absolute; inset: 0; background: #000; }
.cens img { position: absolute; left: 50%; top: 420px; width: 760px; height: 1076px; margin-left: -380px; filter: blur(2px) saturate(.6); }
.cens .band { position: absolute; left: -100px; right: -100px; top: 860px; height: 220px; background: #000; transform: rotate(-10deg);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 128px; letter-spacing: 6px; color: var(--danger);
    border-top: 10px solid var(--danger); border-bottom: 10px solid var(--danger); }
.cens .why { position: absolute; left: 0; right: 0; top: 1610px; text-align: center; font-weight: 900; font-size: 84px; letter-spacing: -1px; color: var(--danger); text-shadow: 6px 6px 0 #000; }
.cens .noise { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 3px, transparent 3px 7px); }

.pe { position: absolute; left: 50px; right: 50px; top: 1330px; display: flex; align-items: center; gap: 30px; padding: 30px 34px; z-index: 5;
    border-radius: 24px; background: #0b0908; border: 4px solid var(--orange); box-shadow: 0 30px 60px rgba(0,0,0,.7); opacity: 0; }
.pe img { width: 170px; height: 170px; border-radius: 30px; object-fit: cover; filter: grayscale(1) contrast(1.2); }
.pe .a { font-weight: 800; font-size: 46px; color: var(--text-2); }
.pe .b { font-weight: 900; font-size: 66px; line-height: 1; color: var(--text); white-space: nowrap; }
.pe .c { font-weight: 900; font-size: 60px; color: var(--orange); margin-top: 6px; }
.end-k { position: absolute; left: 60px; top: 520px; font-family: Pixel; font-size: 40px; color: var(--orange); }
.end-1 { position: absolute; left: 60px; right: 60px; top: 610px; font-weight: 900; font-size: 140px; line-height: .95; letter-spacing: -2px; }
.end-2 { position: absolute; left: 60px; right: 60px; top: 1050px; font-weight: 900; font-size: 116px; line-height: .95; letter-spacing: -2px; color: var(--orange); }
.end-logo { position: absolute; left: 50%; top: 1480px; width: 220px; height: 220px; margin-left: -110px; object-fit: contain; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<script src="../engine.js"></script>
<script>
(async () => {
const data = await (await fetch('data.json')).json();
const G = await (await fetch('guilhotina.json')).json();
const A = await (await fetch('tambem.json')).json();
const { el, set, prog, lerp, ease, enter, blink, shake, LEAGUE } = KHC;
LEAGUE.nba = { color: '#7A1F3D', crest: '../../assets/logo/png/ui/escudo-nba.png' };
LEAGUE.premier = { color: '#D4A017', crest: '../../assets/logo/png/ui/escudo-premier.png' };
const L = Object.fromEntries(data.leagues.map(l => [l.tier, l]));
const TIERS = ['elite', 'serie-a', 'serie-b', 'serie-c', 'serie-d'];
const team = (tier, name) => L[tier].matchups.flat().find(t => t.name === name);
const br = v => v.toFixed(2).replace('.', ',');

// ------------------------------------------------------------ helpers locais
function hudFor(root, tier) {
    const h = KHC.hud(root, 'PRÉVIA · SEMANA 7', TIERS);
    const i = TIERS.indexOf(tier);
    h.segs.forEach((s, k) => { if (k < i) s.classList.add('on'); if (k === i) s.classList.add('now'); });
}
const hud0 = root => KHC.hud(root, 'PRÉVIA · SEMANA 7', []);
function head(root, tier, world) {
    const hd = el('div', 'phase-head', root);
    hd.style.setProperty('--c', LEAGUE[tier].color);
    el('div', 'kicker', hd, 'CONFRONTOS DA SEMANA 7');
    el('div', 'league-name', hd, L[tier].label);
    const w = el('div', 'world', hd, world);
    const c = el('img', 'crest', hd); c.src = LEAGUE[tier].crest;
    return { w, c };
}
function drawHead(h, lt) {
    const p = enter(lt, .05, .45, ease.back);
    set(h.c, { s: p, r: (1 - p) * -30 });
    set(h.w, { o: lt < 1.2 ? blink(lt, .15) : 1 });
}
function cards(root, tier, nicks = {}) {
    const box = el('div', 'cards', root);
    box.style.top = '476px'; box.style.gap = '12px';
    const cs = L[tier].matchups.map(m => {
        const cd = KHC.matchCard(box, m, LEAGUE[tier].color);
        cd.rows.forEach(r => {
            const tm = r.team;
            const nick = nicks[tm.name] ? ` · <span class="nick">${nicks[tm.name]}</span>` : '';
            const q = tm.queda >= 40 ? ` · <span class="q">${tm.queda}% queda</span>` : '';
            r.rec.innerHTML = `${tm.record.replace('-', '–')} · ${tm.pos}º${q}${nick}`;
            r.pts.classList.add(tm.playoffs >= 80 ? 'hi' : tm.playoffs < 30 ? 'lo' : 'mid');
        });
        return cd;
    });
    return { box, cs };
}
function drawCards(c, t, a, b) {
    const n = c.cs.length;
    c.cs.forEach((cd, i) => {
        const p = enter(t, lerp(a, b, i / (n - 1)), .35);
        set(cd.card, { o: Math.min(1, p * 1.6), x: (1 - p) * (i % 2 ? 1100 : -1100) });
        const q = ease.out(prog(t, b + .1, b + .8));
        cd.rows.forEach(r => { r.pts.textContent = Math.round(r.team.playoffs * q) + '%'; });
    });
}
const cardOf = (c, name) => c.cs.find(cd => cd.rows.some(r => r.team.name === name));

/** Liga em 5 s: cards (+0,4), % de playoffs, selo (+2,0) e legenda (+2,4). */
function leagueScene(a, tier, cfg) {
    KHC.scene(a, a + 5, root => {
        const s = root.s = {};
        if (cfg.bg) el('div', cfg.bg, root);
        hudFor(root, tier);
        s.h = head(root, tier, cfg.world);
        el('div', 'colhead', root, '<span>V–D · POSIÇÃO</span><span>PLAYOFFS</span>');
        s.c = cards(root, tier, cfg.nicks);
        const hot = cardOf(s.c, cfg.on);
        hot.card.classList.add('hot');
        hot.card.style.marginTop = '44px';
        s.st = KHC.stamp(hot.card, cfg.stamp, { top: -56, rot: -2 });
        s.cap = KHC.caption(root, cfg.caption[0], cfg.caption[1]);
    }, (lt, t, root) => {
        const s = root.s;
        drawHead(s.h, lt);
        drawCards(s.c, t, a + .4, a + .9);
        KHC.drawStamp(s.st, t, a + 2.0);
        KHC.drawCaption(s.cap, t, a + 2.4);
    });
}

// ================================================================ CENAS
// 0–2,8 · Abertura
KHC.scene(0, 2.8, root => {
    const s = root.s = {};
    s.logo = el('img', 'big-logo', root); s.logo.src = LEAGUE.khc.crest;
    s.press = el('div', 'press', root, 'PRESS START');
    s.l1 = el('div', 'open-l', root, 'Prévia'); s.l1.style.top = '800px';
    s.l2 = el('div', 'open-l o', root, 'Semana 7'); s.l2.style.top = '920px';
    s.sub = el('div', 'open-sub', root, '24 confrontos, uma guilhotina<br>e <b>duas ligas novas no radar.</b>');
    s.boot = el('div', 'boot', root);
}, (lt, t, root) => {
    const s = root.s;
    const b = prog(lt, 0, .16);
    set(s.boot, { o: 1 - b, sy: lerp(.004, 1, ease.out(b)) });
    const lp = enter(lt, .05, .6, ease.elastic); set(s.logo, { s: lp, r: (1 - lp) * 20 });
    s.press.textContent = lt < 1.0 ? 'PRESS START' : '▶ START!';
    set(s.press, { o: lt < 1.0 ? blink(lt, .2) : 1 });
    [s.l1, s.l2].forEach((e, i) => { const p = enter(lt, .25 + i * .18, .4, ease.back); set(e, { o: Math.min(1, p * 2), y: (1 - p) * 80 }); });
    const sb = enter(lt, 1.2, .4); set(s.sub, { o: sb, y: (1 - sb) * 40 });
});

leagueScene(2.8, 'elite', {
    world: 'FASE 1 · O CASTELO', on: 'Public Enemy #1',
    stamp: 'Dono da liga no G4 por um fio: 59%',
    caption: ['Public Enemy #1 × Diogoashura.', 'O dono defende a 4ª vaga.'],
});
leagueScene(7.8, 'serie-a', {
    world: 'FASE 2 · TURBO', on: 'Diogoashura', nicks: { Caipiracicaba: 'o Vigarista' },
    stamp: 'Pega os dois donos no mesmo fim de semana',
    caption: ['Diogoashura: Public Enemy na Elite,', 'Ditador Rique na A. Boa sorte.'],
});
leagueScene(12.8, 'serie-b', {
    world: 'FASE 3 · SUBSOLO', on: 'Ceará Dolphins',
    stamp: 'Sem cabeça e com 83% de queda',
    caption: ['Cortado na Guilhotina,', 'lanterna na B. Semana difícil.'],
});

// 17,8–24,3 · Série C · RIVALIDADE MÁXIMA (tela de luta)
KHC.scene(17.8, 24.3, root => {
    const s = root.s = {};
    el('div', 'fight', root);
    hudFor(root, 'serie-c');
    s.k = el('div', 'rv-k', root, 'RIVALIDADE MÁXIMA');
    s.sub = el('div', 'rv-sub', root, 'SÉRIE C · 1º × 2º · O INVICTO EM JOGO');
    const sa = team('serie-c', 'San Andreas Chiefs'), jw = team('serie-c', 'joaoW7');
    const f = (cls, tm, nm, rc) => {
        const d = el('div', 'fighter ' + cls, root);
        el('img', '', d).src = tm.avatar;
        el('div', 'nm', d, nm); el('div', 'rc', d, rc);
        return d;
    };
    s.l = f('l', sa, 'San Andreas', '<b>6–0</b> · 1º · ferpetucco');
    s.r = f('r', jw, 'joaoW7', '<b>5–1</b> · 2º');
    s.vs = el('div', 'vsbig', root, 'VS');
    // números da Sleeper (print do app antes da rodada)
    const STATS = [['MÉDIA', 168.98, 164.92, 2], ['PROJEÇÃO', 154.43, 157.93, 2], ['CHANCE', 48, 52, 0]];
    const bx = el('div', 'bars', root);
    s.bars = STATS.map(([lb, a, b, dg]) => {
        const r = el('div', 'bar', bx);
        const va = el('div', 'v' + (a > b ? ' win' : ''), r), ta = el('div', 'tk l', r);
        el('div', 'lb', r, lb);
        const tb = el('div', 'tk r', r), vb = el('div', 'v' + (b > a ? ' win' : ''), r);
        const ia = el('i', '', ta), ib = el('i', '', tb);
        return { va, vb, ia, ib, a, b, dg, max: Math.max(a, b) };
    });
    s.st = KHC.stamp(bx, 'O invicto chega de azarão', { top: -80, right: 300, rot: -4 });
    s.cap = KHC.caption(root, 'Também na C: 0–6 × 0–6.', 'Kelce Gremista × WI Redentor. Alguém vai ganhar.');
}, (lt, t, root) => {
    const s = root.s;
    set(s.k, { o: lt < 1.0 ? blink(lt, .1) : 1, s: lerp(1.6, 1, enter(lt, 0, .3, ease.back)) });
    set(s.sub, { o: enter(t, 18.1, .3) });
    const a = enter(t, 18.2, .4, ease.back), b = enter(t, 18.35, .4, ease.back);
    set(s.l, { o: Math.min(1, a * 2), x: (1 - a) * -700 }); set(s.r, { o: Math.min(1, b * 2), x: (1 - b) * 700 });
    const v = enter(t, 18.7, .3, ease.back);
    const [x, y] = shake(t, 18.85, .35, 20);
    set(s.vs, { o: v > 0 ? 1 : 0, s: lerp(3, 1, v), x, y });
    s.bars.forEach((g, i) => {
        const q = ease.out(prog(t, 19.3 + i * .3, 19.9 + i * .3));
        const fmt = n => (n * q).toFixed(g.dg) + (g.dg ? '' : '%');
        g.va.textContent = fmt(g.a); g.vb.textContent = fmt(g.b);
        g.ia.style.width = (100 * g.a / g.max * q) + '%'; g.ib.style.width = (100 * g.b / g.max * q) + '%';
    });
    KHC.drawStamp(s.st, t, 20.6);
    KHC.drawCaption(s.cap, t, 21.6);
});

leagueScene(24.3, 'serie-d', {
    world: 'FASE FINAL', on: 'Elieser',
    stamp: 'Pegou gosto pela vitória?',
    caption: ['Claudianosilva × Elieser.', 'O milagre tem segunda temporada?'],
});

// 29,3–33,3 · Guilhotina · rodada 7

// 42,3–46,8 · Plantão: "Segredos do Ditador expostos" → CENSURADO → e o do Public Enemy?
const SECRETS = ['Lanterna em 2025. Não caiu.', 'Fugiu da Guilhotina.', 'Comissário sem time na NBA.'];
KHC.scene(42.3, 46.8, root => {
    const s = root.s = {};
    const tv = s.tv = el('div', 'tv', root);
    s.live = el('div', 'live', tv, '<i></i>PLANTÃO KHC · URGENTE');
    s.h1 = el('div', 'news-h', tv, 'Segredos do Ditador<br><span>expostos</span>');
    s.strike = el('div', 'strike', s.h1);
    s.card = el('img', 'news-card', tv); s.card.src = 'assets/avatars/card.jpg';
    s.tag = el('div', 'news-tag', tv, 'ARQUIVO SECRETO');
    const box = el('div', 'secrets', tv);
    s.sec = SECRETS.map((txt, i) => {
        const r = el('div', 'sec', box);
        r.t = el('span', '', r, `${i + 1}. ${KHC.esc(txt)}`);
        r.bar = el('i', 'redact', r);
        return r;
    });
    s.cens = el('div', 'cens2', tv, 'CENSURADO');
    s.why = el('div', 'why2', tv, 'Quem mandou sumir?!');
    s.tick = el('div', 'ticker', tv, '<div class="tk"></div>');
    s.tk = s.tick.firstChild;
    el('div', 'scan', tv);
    // depois do "desligar da TV": cartaz de desaparecido
    const pe = team('elite', 'Public Enemy #1');
    s.post = el('div', 'poster', root, `<div class="ph">DESAPARECIDO</div><img src="${pe.avatar}">
      <div class="pn">O dossiê do<br><b>Public Enemy #1</b></div><div class="pw">Visto pela última vez: nunca.</div><div class="pq">Onde estará?</div>`);
}, (lt, t, root, wall) => {
    const s = root.s;
    // 1) plantão abre
    set(s.live, { o: enter(lt, 0, .15) });
    s.live.firstChild.style.opacity = blink(wall, .25);
    const h = enter(lt, .05, .35, ease.back); set(s.h1, { o: Math.min(1, h * 2), s: lerp(1.3, 1, h) });
    const c = enter(lt, .2, .4, ease.back); set(s.card, { o: Math.min(1, c * 2), x: (1 - c) * -700, r: lerp(-14, -4, c) });
    set(s.tag, { o: enter(lt, .45, .2), r: 6 });
    s.sec.forEach((r, i) => {
        const a = .55 + i * .22;
        const n = Math.round(r.t.textContent.length * prog(lt, a, a + .2));
        r.style.clipPath = `inset(0 ${100 - prog(lt, a, a + .2) * 100}% 0 0)`;
        // 2) tarjas pretas apagam os segredos
        r.bar.style.width = (100 * ease.out(prog(lt, 1.35 + i * .08, 1.5 + i * .08))) + '%';
    });
    s.strike.style.width = (100 * ease.out(prog(lt, 1.4, 1.55))) + '%';
    // 3) o CENSURADO sobe e bate
    const u = ease.out(prog(lt, 1.5, 1.72));
    set(s.cens, { o: lt >= 1.5 ? 1 : 0, y: lerp(1300, 0, u), r: -9, s: 1 + Math.sin(prog(lt, 1.72, 1.9) * Math.PI) * .08 });
    const w = enter(lt, 1.9, .25, ease.back); set(s.why, { o: Math.min(1, w * 2), s: lerp(1.6, 1, w) });
    s.tk.textContent = lt < 1.5 ? 'PLANTÃO KHC · SEGREDOS DO DITADOR · EXCLUSIVO · PLANTÃO KHC · SEGREDOS DO DITADOR · EXCLUSIVO · '
                                : 'TRANSMISSÃO INTERROMPIDA · SINAL CORTADO · TRANSMISSÃO INTERROMPIDA · SINAL CORTADO · ';
    s.tk.style.transform = `translateX(${-((wall * 380) % 900)}px)`;
    const g = (lt > 1.35 && lt < 1.45) || (lt > 1.72 && lt < 1.78);
    s.tv.style.filter = g ? 'invert(1) hue-rotate(90deg)' : 'none';
    const [x, y] = shake(lt, 1.72, .35, 26);
    // 4) a TV desliga (vira uma linha) e entra o cartaz
    const off = prog(lt, 2.4, 2.55);
    s.tv.style.transform = `translate(${x}px, ${y}px) scale(${lerp(1, 1.05, off)}, ${lerp(1, .004, off)})`;
    s.tv.style.opacity = lt < 2.55 ? 1 : 0;
    const p = enter(lt, 2.6, .35, ease.back);
    set(s.post, { o: lt >= 2.6 ? Math.min(1, p * 2) : 0, s: lerp(.6, 1, p), r: lerp(8, -2, p) });
});
