<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KHC Prévia · Semana 8</title>
<link rel="stylesheet" href="../engine.css">
<style>
:root { --blood: #B3121B; --gold: #F2B705; }
.boot { position: absolute; inset: 0; background: #fff; transform-origin: center; }
.big-logo { position: absolute; left: 50%; top: 230px; width: 380px; height: 380px; margin-left: -190px; object-fit: contain;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.6)); }
.press { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-family: Pixel; font-size: 40px; color: var(--gold); text-shadow: 5px 5px 0 #000; }
.open-l { position: absolute; left: 60px; right: 60px; font-weight: 900; font-size: 120px; line-height: .95; letter-spacing: -2px; text-transform: uppercase; }
.open-l.o { color: var(--orange); }
.open-sub { position: absolute; left: 60px; right: 60px; top: 1260px; font-weight: 700; font-size: 56px; line-height: 1.1; color: var(--text-2); }
.open-sub b { color: var(--orange); }
.half-bar { position: absolute; left: 60px; right: 60px; top: 1480px; height: 40px; border-radius: 10px; background: #1d1916; overflow: hidden; border: 3px solid #3A322C; }
.half-bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--orange) 0 30px, #ff8a45 30px 36px); }
.half-lb { position: absolute; left: 60px; right: 60px; top: 1540px; display: flex; justify-content: space-between; font-family: Mono; font-size: 30px; color: var(--text-3); }

/* tabela da divisão */
.world { font-family: Mono !important; font-size: 30px !important; letter-spacing: 3px; }
.tbl-h { position: absolute; left: 60px; right: 60px; top: 468px; display: grid; grid-template-columns: 50px 62px 1fr 84px 196px 96px; gap: 12px;
    font-family: Mono; font-size: 22px; letter-spacing: 2px; color: var(--text-3); }
.tbl { position: absolute; left: 44px; right: 44px; top: 506px; display: flex; flex-direction: column; gap: 6px; }
.sr { position: relative; display: grid; grid-template-columns: 50px 62px 1fr 84px 196px 96px; gap: 12px; align-items: center; height: 88px;
    padding: 0 16px; border-radius: 16px; background: rgba(22,19,17,.94); border: 2px solid #2a2420; }
.sr .p { font-family: Mono; font-size: 38px; color: var(--text-3); text-align: center; }
.sr .av { width: 60px; height: 60px; border-radius: 13px; }
.sr .n { font-weight: 800; font-size: 40px; font-stretch: 78%; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr .r { font-family: Mono; font-size: 34px; color: var(--text-2); text-align: center; }
.sr .po { display: flex; align-items: center; gap: 10px; }
.sr .po .bar { flex: 1; height: 16px; border-radius: 8px; background: #2a2420; overflow: hidden; }
.sr .po .bar i { display: block; height: 100%; width: 0; background: var(--c); }
.sr .po b { font-family: Mono; font-size: 32px; font-weight: 700; width: 88px; text-align: right; color: var(--text); }
.sr .q { font-family: Mono; font-size: 32px; text-align: right; color: var(--text-3); }
.sr .q.hot { color: #ff5a4e; }
.sr.zone { background: rgba(60,14,14,.9); border-color: #5a1d1a; }
.sr.zone .p { color: #ff5a4e; }
.sr.on { border: 3px solid var(--orange); box-shadow: 0 0 0 3px rgba(242,106,27,.25), 0 18px 40px rgba(0,0,0,.5); z-index: 2; }
.cut { position: relative; height: 0; border-top: 4px dashed var(--c); margin: 6px 0; }
.cut span { position: absolute; right: 12px; top: -15px; background: var(--bg); padding: 0 10px; font-family: Mono; font-size: 22px; letter-spacing: 2px; color: var(--c); }
.cut.red { border-color: var(--danger); } .cut.red span { color: var(--danger); }
.vs-chip { position: absolute; left: -10px; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; background: var(--orange);
    color: #120a05; font-family: Pixel; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 3; opacity: 0; }

/* cards da Série A */
.cd-k { position: absolute; left: 60px; top: 240px; font-family: Mono; font-size: 30px; letter-spacing: 3px; color: var(--gold); }
.cd-t { position: absolute; left: 60px; right: 60px; top: 290px; font-weight: 900; font-size: 96px; line-height: .95; letter-spacing: -2px; text-transform: uppercase; }
.cd-t span { color: var(--orange); }
.cd-h { position: absolute; left: 60px; right: 60px; top: 505px; display: flex; justify-content: space-between; font-family: Mono; font-size: 22px; letter-spacing: 2px; color: var(--text-3); }
.fear { position: absolute; left: 44px; right: 44px; top: 540px; display: flex; flex-direction: column; gap: 8px; }
.fr { position: relative; display: grid; grid-template-columns: 44px 60px 1fr 50px 60px 70px; gap: 12px; align-items: center; height: 84px; padding: 0 16px;
    border-radius: 16px; background: rgba(22,19,17,.94); border: 2px solid #2a2420; }
.fr .p { font-family: Mono; font-size: 32px; color: var(--text-3); text-align: center; }
.fr .av { width: 58px; height: 58px; border-radius: 13px; }
.fr .nm { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fr .nm b { font-weight: 800; font-size: 36px; font-stretch: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr .nm i { font-style: normal; font-family: Mono; font-size: 20px; letter-spacing: 1px; color: #fff; padding: 4px 8px; border-radius: 6px; flex: none; }
.fr .ar { font-family: Pixel; font-size: 30px; color: var(--orange); text-align: center; }
.fr .fp { font-family: Mono; font-size: 32px; color: var(--text-2); }
.fr.hit { border: 3px solid var(--success); box-shadow: 0 0 40px rgba(61,214,140,.25); }
.fr.hit .ar, .fr.hit .fp { color: var(--success); }
/* modo furtivo */
.mg-bg { position: absolute; inset: 0; background: radial-gradient(900px 800px at 50% 40%, #0d2a17, #050a06 75%); }
.mg-k { position: absolute; left: 0; right: 0; top: 240px; text-align: center; font-family: Pixel; font-size: 54px; color: #4dff88; text-shadow: 0 0 24px rgba(77,255,136,.5), 5px 5px 0 #000; }
.mg-sub { position: absolute; left: 0; right: 0; top: 320px; text-align: center; font-family: Mono; font-size: 30px; letter-spacing: 3px; color: #9fe8b5; }
.radar { position: absolute; left: 240px; top: 400px; width: 600px; height: 600px; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle, rgba(77,255,136,.10), rgba(0,0,0,.4) 70%); border: 4px solid #2f8f52; box-shadow: 0 0 60px rgba(77,255,136,.2); }
.radar .ring { position: absolute; border: 2px solid rgba(77,255,136,.25); border-radius: 50%; }
.radar .r1 { inset: 100px; } .radar .r2 { inset: 200px; }
.radar .cross { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 49.8%, rgba(77,255,136,.25) 50%, transparent 50.2%), linear-gradient(0deg, transparent 49.8%, rgba(77,255,136,.25) 50%, transparent 50.2%); }
.sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(77,255,136,.55), rgba(77,255,136,0) 50deg, transparent 360deg); }
.blip { position: absolute; width: 84px; text-align: center; margin: -42px 0 0 -42px; }
.blip img { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #4dff88; object-fit: cover; }
.blip .tg { font-family: Mono; font-size: 18px; letter-spacing: 2px; color: #4dff88; margin-top: 2px; }
.hidden { position: absolute; width: 110px; height: 110px; }
.hidden .vb { position: absolute; inset: 0; width: 110px; height: 110px; border-radius: 22px; border: 5px solid #fff; object-fit: cover; opacity: 0; }
.box { position: absolute; left: -10px; top: -6px; width: 130px; height: 120px; border-radius: 6px; background: linear-gradient(180deg, #b98a52, #8f6534);
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.18), 0 10px 20px rgba(0,0,0,.5); }
.box i { position: absolute; left: 56px; top: 0; bottom: 0; width: 18px; background: #d9c39a; }
.excl { position: absolute; left: 30px; top: -96px; width: 50px; text-align: center; font-family: Pixel; font-size: 76px; color: #ff3b30; text-shadow: 4px 4px 0 #000; opacity: 0; }
.mg-alert { position: absolute; left: 80px; right: 80px; top: 1040px; text-align: center; font-family: Mono; font-size: 52px; font-weight: 700; letter-spacing: 6px;
    color: #fff; background: #c4161c; border-radius: 12px; padding: 10px 0; opacity: 0; }
/* guilhotina */
.redbg { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 50% -5%, rgba(179,18,27,.35), transparent 65%); }
.g-k { position: absolute; left: 60px; top: 240px; font-family: Mono; font-size: 32px; letter-spacing: 3px; color: var(--gold); }
.g-t { position: absolute; left: 60px; right: 270px; top: 300px; font-weight: 900; font-size: 84px; line-height: .95; letter-spacing: -2px; color: var(--blood); text-transform: uppercase; }
.g-crest { position: absolute; right: 60px; top: 230px; width: 190px; height: 220px; object-fit: contain; }
.blade { position: absolute; left: 50px; width: 980px; height: 190px; z-index: 4; }
.blade svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
.rope { position: absolute; left: 536px; top: 0; width: 8px; background: #8c6a43; z-index: 3; }
.group { position: absolute; left: 50px; right: 50px; display: flex; flex-direction: column; gap: 14px; }
.lbl { font-family: Mono; font-size: 28px; letter-spacing: 3px; margin: 0 0 4px 6px; }
.lbl.bad { color: var(--danger); } .lbl.good { color: var(--success); } .lbl.gold { color: var(--gold); }
.trow.win { border-color: var(--success); } .trow.lose { border-color: var(--danger); } .trow.hot { border-color: var(--orange); }

/* também na KHC */
.also-k { position: absolute; left: 60px; top: 240px; font-family: Mono; font-size: 32px; letter-spacing: 3px; color: var(--gold); }
.also-t { position: absolute; left: 60px; right: 300px; top: 300px; font-weight: 900; font-size: 92px; line-height: .95; letter-spacing: -2px; text-transform: uppercase; }
.also-crest { position: absolute; right: 60px; top: 240px; width: 200px; height: 220px; object-fit: contain; }

.end-k { position: absolute; left: 60px; top: 520px; font-family: Pixel; font-size: 40px; color: var(--orange); }
.end-1 { position: absolute; left: 60px; right: 60px; top: 610px; font-weight: 900; font-size: 130px; line-height: .95; letter-spacing: -2px; }
.end-2 { position: absolute; left: 60px; right: 60px; top: 1000px; font-weight: 900; font-size: 116px; line-height: .95; letter-spacing: -2px; color: var(--orange); }
.end-logo { position: absolute; left: 50%; top: 1480px; width: 220px; height: 220px; margin-left: -110px; object-fit: contain; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<script src="../engine.js"></script>
<script>
(async () => {
const data = await (await fetch('data.json')).json();
const G = await (await fetch('guilhotina.json')).json();
const A = await (await fetch('tambem.json')).json();
const { el, set, prog, lerp, ease, enter, blink, shake, LEAGUE } = KHC;
LEAGUE.nba = { color: '#7A1F3D', crest: '../../assets/logo/png/ui/escudo-nba.png' };
LEAGUE.premier = { color: '#D4A017', crest: '../../assets/logo/png/ui/escudo-premier.png' };
const L = Object.fromEntries(data.leagues.map(l => [l.tier, l]));
const TIERS = ['elite', 'serie-a', 'serie-b', 'serie-c', 'serie-d'];
// regras de 2026: playoffs top 4 na Elite e top 6 nas séries; caem 3 (A, B e C; D é a última)
const PO = { elite: 4, 'serie-a': 6, 'serie-b': 6, 'serie-c': 6, 'serie-d': 6 };
const REL = { 'serie-a': 3, 'serie-b': 3, 'serie-c': 3 };

function hudFor(root, tier) {
    const h = KHC.hud(root, 'PRÉVIA · SEMANA 8', TIERS);
    const i = TIERS.indexOf(tier);
    h.segs.forEach((s, k) => { if (k < i) s.classList.add('on'); if (k === i) s.classList.add('now'); });
}
const hud0 = root => KHC.hud(root, 'PRÉVIA · SEMANA 8', []);
const pct = v => (v >= 99 ? '>99%' : v <= 0 ? '<1%' : v + '%');

/** Tabela da divisão (após a rodada 7) com o confronto da semana em destaque. */
function standScene(a, tier, cfg) {
    const D = 5.5;
    KHC.scene(a, a + D, root => {
        const s = root.s = {};
        const c = LEAGUE[tier].color;
        root.style.setProperty('--c', c);
        hudFor(root, tier);
        const hd = el('div', 'phase-head', root);
        hd.style.setProperty('--c', c);
        el('div', 'kicker', hd, 'APÓS A RODADA 7');
        el('div', 'league-name', hd, L[tier].label);
        s.w = el('div', 'world', hd, cfg.world);
        s.cr = el('img', 'crest', hd); s.cr.src = LEAGUE[tier].crest;
        const rel = REL[tier];
        el('div', 'tbl-h', root, `<span>#</span><span></span><span>TIME</span><span>V–D</span><span>PLAYOFFS</span><span>${rel ? 'QUEDA' : ''}</span>`);
        const teams = L[tier].matchups.flat().sort((x, y) => x.pos - y.pos);
        const box = el('div', 'tbl', root);
        s.rows = [];
        teams.forEach(tm => {
            if (tm.pos === PO[tier] + 1) el('div', 'cut', box, '<span>PLAYOFFS ▲</span>');
            if (rel && tm.pos === teams.length - rel + 1) el('div', 'cut red', box, '<span>ZONA DE QUEDA ▼</span>');
            const r = el('div', 'sr' + (rel && tm.pos > teams.length - rel ? ' zone' : ''), box);
            el('div', 'p', r, tm.pos);
            const av = el('div', 'av', r); if (tm.avatar) el('img', '', av).src = tm.avatar;
            el('div', 'n', r, KHC.esc(tm.name));
            el('div', 'r', r, tm.record.replace('-', '–'));
            const po = el('div', 'po', r, '<div class="bar"><i></i></div><b>0%</b>');
            r.bar = po.querySelector('i'); r.val = po.querySelector('b');
            el('div', 'q' + (tm.queda >= 40 ? ' hot' : ''), r, rel ? pct(tm.queda) : '');
            r.tm = tm;
            if (cfg.on.includes(tm.name)) { r.classList.add('on'); r.chip = el('div', 'vs-chip', r, 'VS'); }
            s.rows.push(r);
        });
        const hot = s.rows.filter(r => cfg.on.includes(r.tm.name));
        s.st = KHC.stamp(root, cfg.stamp, { top: 1478, right: 60, rot: -2 }); s.st.style.fontSize = '36px';
        s.cap = KHC.caption(root, cfg.caption[0], cfg.caption[1]);
        s.cap.c.style.top = '1580px';
    }, (lt, t, root) => {
        const s = root.s;
        const p = enter(lt, .05, .45, ease.back); set(s.cr, { s: p, r: (1 - p) * -30 });
        set(s.w, { o: lt < 1.2 ? blink(lt, .15) : 1 });
        s.rows.forEach((r, i) => {
            const e = enter(t, a + .35 + i * .05, .3);
            set(r, { o: Math.min(1, e * 1.6), x: (1 - e) * (i % 2 ? 600 : -600) });
            const q = ease.out(prog(t, a + .9, a + 1.6));
            r.bar.style.width = (r.tm.playoffs * q) + '%';
            r.val.textContent = q >= 1 ? pct(r.tm.playoffs) : Math.round(r.tm.playoffs * q) + '%';
            if (r.chip) { const c = enter(t, a + 1.8, .25, ease.back); set(r.chip, { o: c, s: lerp(2, 1, c) }); }
        });
        KHC.drawStamp(s.st, t, a + 2.1);
        KHC.drawCaption(s.cap, t, a + 2.6);
    });
}

// ================================================================ CENAS
// 0–3 · Abertura: metade da temporada
KHC.scene(0, 3, root => {
    const s = root.s = {};
    s.logo = el('img', 'big-logo', root); s.logo.src = LEAGUE.khc.crest;
    s.press = el('div', 'press', root, 'PRESS START');
    s.l1 = el('div', 'open-l', root, 'Prévia'); s.l1.style.top = '800px';
    s.l2 = el('div', 'open-l o', root, 'Semana 8'); s.l2.style.top = '920px';
    s.sub = el('div', 'open-sub', root, 'Passamos da metade.<br><b>Hora de ver quem está onde.</b>');
    s.bar = el('div', 'half-bar', root, '<i></i>');
    s.lb = el('div', 'half-lb', root, '<span>TEMPORADA REGULAR</span><span>7 DE 14</span>');
    s.boot = el('div', 'boot', root);
}, (lt, t, root) => {
    const s = root.s;
    const b = prog(lt, 0, .16);
    set(s.boot, { o: 1 - b, sy: lerp(.004, 1, ease.out(b)) });
    const lp = enter(lt, .05, .6, ease.elastic); set(s.logo, { s: lp, r: (1 - lp) * 20 });
    s.press.textContent = lt < 1.0 ? 'PRESS START' : '▶ START!';
    set(s.press, { o: lt < 1.0 ? blink(lt, .2) : 1 });
    [s.l1, s.l2].forEach((e, i) => { const p = enter(lt, .25 + i * .18, .4, ease.back); set(e, { o: Math.min(1, p * 2), y: (1 - p) * 80 }); });
    const sb = enter(lt, 1.1, .4); set(s.sub, { o: sb, y: (1 - sb) * 40 });
    set(s.bar, { o: enter(lt, 1.4, .3) }); set(s.lb, { o: enter(lt, 1.4, .3) });
    s.bar.firstChild.style.width = (50 * ease.out(prog(lt, 1.5, 2.3))) + '%';
});

standScene(3, 'elite', {
    world: 'TOP 4 VAI AOS PLAYOFFS', on: ['Public Enemy #1', 'GORDINHAS AJEITADAS'], stampOn: 1,
    stamp: 'Dono fora do G4 pega o líder',
    caption: ['Public Enemy (44%) × Gordinhas (99%).', 'O dono precisa de um milagre.'],
});
standScene(8.5, 'serie-a', {
    world: 'TOP 6 · CAEM 3', on: ['Imperius Rex FC', 'Caipiracicaba'],
    stamp: '2º na tabela. #13 no Power Ranking.',
    caption: ['O Ditador pega o 9º colocado.', 'Se perder, nem a censura esconde.'],
});
// 14–18,5 · Modo Furtivo: o líder da Série A que ninguém viu (VoliBEARS)
KHC.scene(14, 18.5, root => {
    const s = root.s = {};
    el('div', 'mg-bg', root);
    hudFor(root, 'serie-a');
    el('div', 'mg-k', root, 'MODO FURTIVO');
    el('div', 'mg-sub', root, 'SÉRIE A · O LÍDER QUE NINGUÉM VIU');
    const rd = el('div', 'radar', root);
    s.sweep = el('div', 'sweep', rd);
    el('div', 'ring r1', rd); el('div', 'ring r2', rd); el('div', 'cross', rd);
    const T = n => L['serie-a'].matchups.flat().find(x => x.name === n);
    // os "alvos" que a KHC sempre vê: os donos e quem dá assunto
    s.blips = [['Imperius Rex FC', 210, 150, 60], ['Public Enemy #1', 430, 200, 150], ['Los Pollos Hermanos', 120, 400, 250], ['Caipiracicaba', 420, 430, 320]]
        .map(([n, x, y, ang]) => {
            const b = el('div', 'blip', rd);
            b.style.left = x + 'px'; b.style.top = y + 'px';
            el('img', '', b).src = T(n).avatar;
            el('div', 'tg', b, 'VISTO');
            b.ang = ang; return b;
        });
    const vb = T('VoliBEARS');
    s.hid = el('div', 'hidden', rd);
    s.av = el('img', 'vb', s.hid); s.av.src = vb.avatar;
    s.box = el('div', 'box', s.hid, '<i></i>');
    s.ex = el('div', 'excl', s.hid, '!');
    s.alert = el('div', 'mg-alert', root, 'LÍDER DETECTADO');
    const g = el('div', 'group', root); g.style.top = '1220px';
    s.row = KHC.teamRow(g, { name: 'VoliBEARS', avatar: vb.avatar, sub: '1º · 5 vitórias seguidas · 99% playoffs', value: vb.record.replace('-', '–') });
    s.row.row.classList.add('win');
    s.st = KHC.stamp(s.row.row, 'Só Los Pollos Hermanos venceu ele', { top: -56, right: 24, rot: -3 });
    s.cap = KHC.caption(root, '6–1, 5 vitórias seguidas', 'e ninguém viu.');
}, (lt, t, root, wall) => {
    const s = root.s;
    const ang = (lt * 260) % 360;
    s.sweep.style.transform = `rotate(${ang}deg)`;
    s.blips.forEach(b => { const d = (ang - b.ang + 360) % 360; const seen = lt * 260 >= b.ang; set(b, { o: seen ? 1 : .15, s: seen && d < 40 ? 1.12 : 1 }); b.lastChild.style.opacity = seen ? 1 : 0; });
    // a caixa avança aos pulinhos, parando quando o radar passa
    const hop = Math.floor(Math.min(lt, 1.8) / .3);
    const pp = Math.min(1, (hop + ease.out((Math.min(lt, 1.8) % .3) / .3)) / 6);
    s.hid.style.left = lerp(30, 245, pp) + 'px'; s.hid.style.top = lerp(470, 245, pp) + 'px';
    s.hid.style.transform = `scale(${lerp(1, 1.6, enter(lt, 2.0, .3, ease.back))})`;
    const up = ease.out(prog(lt, 1.9, 2.15));
    set(s.box, { y: -up * 260, r: up * -25, o: 1 - prog(lt, 2.0, 2.2) });
    set(s.av, { o: lt >= 1.95 ? 1 : 0, s: lerp(.6, 1, enter(lt, 1.95, .25, ease.back)) });
    const e = enter(lt, 2.0, .18, ease.back); set(s.ex, { o: e, s: lerp(2.6, 1, e), y: -Math.abs(Math.sin(wall * 12)) * 8 });
    set(s.alert, { o: lt < 2.0 ? 0 : (lt < 2.6 ? blink(lt, .1) : 1) });
    const r = enter(t, 16.25, .35); set(s.row.row, { o: Math.min(1, r * 1.6), x: (1 - r) * -1100 });
    KHC.drawStamp(s.st, t, 16.6);
    KHC.drawCaption(s.cap, t, 16.95);
});

// 18,5–24,5 · Os cards da Série A: franquia de torcida e o "adversário mais forte"
// de cada um (cards enviados pelo usuário; posição após a rodada 7)
const CARDS = [['VoliBEARS', 'BEARS', 'Caipiracicaba'], ['Imperius Rex FC', '49ERS', 'Caipiracicaba'],
