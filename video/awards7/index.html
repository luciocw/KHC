<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KHC Awards · Semana 7</title>
<link rel="stylesheet" href="../engine.css">
<style>
:root { --blood: #B3121B; --gold: #F2B705; --ok: #3DD68C; }
.boot { position: absolute; inset: 0; background: #fff; transform-origin: center; }
.big-logo { position: absolute; left: 50%; top: 230px; width: 380px; height: 380px; margin-left: -190px; object-fit: contain;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.6)); }
.awards-px { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-family: Pixel; font-size: 46px; color: var(--gold); text-shadow: 5px 5px 0 #000; }
.open-l { position: absolute; left: 60px; right: 60px; font-weight: 900; font-size: 112px; line-height: .95; letter-spacing: -2px; text-transform: uppercase; }
.open-l.o { color: var(--orange); }
.week-chip { position: absolute; left: 60px; top: 1290px; font-family: Mono; font-size: 46px; letter-spacing: 4px; background: var(--orange);
    color: #120a05; padding: 14px 26px; border-radius: 10px; }
.open-sub { position: absolute; left: 60px; right: 60px; top: 1420px; font-weight: 600; font-size: 50px; line-height: 1.15; color: var(--text-2); }

.award { position: absolute; left: 60px; right: 60px; top: 230px; }
.award .n { font-weight: 800; font-size: 32px; letter-spacing: 6px; color: var(--text-2); display: flex; align-items: center; gap: 18px; }
.award .n::before { content: ''; width: 60px; height: 5px; background: var(--orange); }
.award .t { font-weight: 900; font-size: 96px; line-height: .98; letter-spacing: -1px; color: var(--orange); margin-top: 14px; text-transform: uppercase; font-stretch: 108%; }
.award .px { font-family: Mono; font-size: 32px; letter-spacing: 3px; color: var(--gold); margin-top: 18px; }
.award.red .t { color: var(--blood); } .award.red .n::before { background: var(--blood); }
.group { position: absolute; left: 50px; right: 50px; display: flex; flex-direction: column; gap: 14px; }
.glabel { font-family: Mono; font-size: 30px; letter-spacing: 2px; margin: 0 0 6px 6px; }
.good { color: var(--success); } .bad { color: var(--danger); } .gold { color: var(--gold); }
.trow.win { border-color: var(--success); box-shadow: 0 0 40px rgba(61,214,140,.25); }
.trow.lose { border-color: var(--danger); } .trow.hot { border-color: var(--orange); }
.tsub .q { color: var(--danger); } .nick { color: var(--gold); }

/* ===== LAG ===== */
.game { position: absolute; inset: 0; background: radial-gradient(900px 700px at 50% 40%, #10204a, #05070d 75%); }
.g-top { position: absolute; left: 50px; right: 50px; top: 90px; display: flex; justify-content: space-between; align-items: center; }
.g-live { font-family: Mono; font-size: 30px; letter-spacing: 3px; color: #fff; background: var(--danger); padding: 10px 18px; border-radius: 8px; }
.ping { display: flex; align-items: center; gap: 16px; font-family: Mono; font-size: 40px; color: var(--ok); }
.wifi { display: flex; align-items: flex-end; gap: 6px; height: 44px; }
.wifi i { width: 12px; background: currentColor; border-radius: 3px; }
.g-title { position: absolute; left: 0; right: 0; top: 205px; text-align: center; font-weight: 900; font-style: italic; font-size: 70px; color: var(--gold); text-shadow: 5px 5px 0 #000; }
.g-sub { position: absolute; left: 0; right: 0; top: 290px; text-align: center; font-family: Mono; font-size: 28px; letter-spacing: 3px; color: var(--text-2); }
.board { position: absolute; left: 40px; right: 40px; top: 380px; height: 560px; }
.side { position: absolute; top: 0; width: 470px; text-align: center; }
.side.l { left: 0; } .side.r { right: 0; }
.side img { width: 250px; height: 250px; border-radius: 34px; object-fit: cover; border: 7px solid #fff; }
.side .nm { font-weight: 900; font-size: 50px; margin-top: 18px; white-space: nowrap; }
.side .sc { font-family: Mono; font-size: 104px; line-height: 1; margin-top: 16px; color: #fff; }
.side .tag { display: inline-block; margin-top: 16px; font-family: Pixel; font-size: 26px; padding: 10px 16px; border-radius: 6px; opacity: 0; }
.side.l .tag { background: var(--danger); color: #fff; } .side.r .tag { background: var(--ok); color: #05210f; }
.g-vs { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-family: Pixel; font-size: 70px; color: var(--orange); text-shadow: 6px 6px 0 #000; }
.warn { position: absolute; left: 50px; right: 50px; top: 960px; height: 120px; display: flex; align-items: center; justify-content: center; gap: 22px;
    background: rgba(235,64,52,.15); border: 4px solid var(--danger); border-radius: 18px; font-weight: 900; font-size: 52px; color: #ff6b5e; opacity: 0; }
.spin { width: 60px; height: 60px; border-radius: 50%; border: 9px solid rgba(255,255,255,.2); border-top-color: #fff; }
.reco { position: absolute; left: 50px; right: 50px; top: 1110px; opacity: 0; }
.reco .lb { font-family: Mono; font-size: 30px; letter-spacing: 3px; color: var(--text-2); }
.reco .bar { margin-top: 12px; height: 34px; border-radius: 8px; background: #1d1916; overflow: hidden; border: 3px solid #333; }
.reco .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #3B82F6 0 26px, #6aa2ff 26px 32px); }
.chat { position: absolute; left: 50px; right: 50px; top: 1170px; display: flex; flex-direction: column; gap: 10px; }
.msg { font-family: Mono; font-size: 30px; white-space: nowrap; color: #fff; background: rgba(0,0,0,.55); padding: 10px 16px; border-radius: 10px; opacity: 0; }
.msg b { color: var(--orange); } .msg b.j { color: #6aa2ff; }
.pix { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 6px, transparent 6px 14px), repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 6px, transparent 6px 14px); }
.tear { position: absolute; left: 0; right: 0; height: 70px; opacity: 0; mix-blend-mode: difference; background: #3cf; pointer-events: none; }

/* Kane / Bola de Ouro */
.kane { position: absolute; left: 50px; right: 50px; top: 930px; display: flex; align-items: center; gap: 28px; padding: 26px 30px; border-radius: 24px;
    background: linear-gradient(90deg, rgba(242,183,5,.18), rgba(22,19,17,.94)); border: 3px solid var(--gold); opacity: 0; }
.ball { width: 130px; height: 130px; flex: none; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c8 0 8%, #f7d24a 22%, #c99a06 60%, #7a5a00 100%); box-shadow: 0 0 50px rgba(242,183,5,.6); }
.kane .a { font-family: Mono; font-size: 26px; letter-spacing: 2px; color: var(--gold); }
.kane .b { font-weight: 900; font-size: 46px; line-height: 1.05; margin-top: 6px; }
.kane .b span { color: var(--gold); }

/* NBA */
.ghost { position: absolute; left: 50px; right: 50px; top: 1150px; height: 140px; display: flex; align-items: center; gap: 26px; padding: 0 30px;
    border: 4px dashed var(--danger); border-radius: 24px; background: rgba(235,64,52,.08); }
.ghost .qq { width: 96px; height: 96px; border-radius: 22px; background: #1d1916; display: flex; align-items: center; justify-content: center;
    font-family: Pixel; font-size: 54px; color: var(--danger); }
.ghost .nm { font-weight: 900; font-size: 44px; } .ghost .sb { font-family: Mono; font-size: 28px; color: var(--text-3); margin-top: 6px; }
.crest-r { position: absolute; right: 60px; top: 230px; width: 190px; height: 210px; object-fit: contain; }

/* guilhotina */
.redbg { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 50% -5%, rgba(179,18,27,.35), transparent 65%); }
.flash { position: absolute; inset: 0; background: var(--blood); opacity: 0; pointer-events: none; z-index: 20; mix-blend-mode: screen; }
.blade { position: absolute; left: 0; width: 980px; height: 190px; z-index: 10; pointer-events: none; }
.blade svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
.slot { position: relative; height: 118px; }
.half { position: absolute; inset: 0; }
.half.top { clip-path: polygon(-5% -50%, 105% -50%, 105% 44%, -5% 62%); }
.half.bot { clip-path: polygon(-5% 62%, 105% 44%, 105% 150%, -5% 150%); }
.half .trow { position: absolute; inset: 0; }
.cutl { position: absolute; left: -20px; right: -20px; top: 52%; height: 6px; margin-top: -3px; background: #fff; transform-origin: left center;
    box-shadow: 0 0 18px #ff3b3b, 0 0 40px var(--blood); opacity: 0; z-index: 4; }
.rip { position: absolute; left: 6px; top: -18px; z-index: 6; font-family: Pixel; font-size: 20px; color: #fff; background: var(--blood); padding: 6px 10px; border-radius: 4px; opacity: 0; }
.roast { font-weight: 800; font-size: 40px; color: var(--orange); text-align: center; margin: 24px 0 86px; opacity: 0; }

.end-k { position: absolute; left: 60px; top: 540px; font-family: Pixel; font-size: 40px; color: var(--orange); }
.end-1 { position: absolute; left: 60px; right: 60px; top: 630px; font-weight: 900; font-size: 130px; line-height: .95; letter-spacing: -2px; }
.end-2 { position: absolute; left: 60px; right: 60px; top: 1010px; font-weight: 900; font-size: 116px; line-height: .95; letter-spacing: -2px; color: var(--orange); }
.end-logo { position: absolute; left: 50%; top: 1460px; width: 220px; height: 220px; margin-left: -110px; object-fit: contain; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<script src="../engine.js"></script>
<script>
(async () => {
const data = await (await fetch('data.json')).json();
const G = await (await fetch('guilhotina.json')).json();
const A = await (await fetch('tambem.json')).json();
const { el, set, prog, lerp, ease, enter, blink, shake, LEAGUE } = KHC;
LEAGUE.nba = { color: '#7A1F3D', crest: '../../assets/logo/png/ui/escudo-nba.png' };
LEAGUE.premier = { color: '#D4A017', crest: '../../assets/logo/png/ui/escudo-premier.png' };
const ALL = data.leagues.flatMap(l => l.matchups.flat().map(t => ({ ...t, tier: l.tier })));
const T = (name, tier) => ALL.find(t => t.name.trim() === name && (!tier || t.tier === tier)) || {};
const pts = (n, tier) => T(n, tier).points;
const rec = (n, tier) => T(n, tier).record.replace('-', '–');
const GT = n => G.teams.find(t => t.name === n);
const PT = n => A.premier.teams.find(t => t.name === n);
const br = v => v.toFixed(2).replace('.', ',');
const W7 = G.weeks[G.weeks.length - 1];
// chances após a rodada 7 (imagens do site); null = ainda não recebidas
const CH = {};

// ------------------------------------------------------------ helpers locais
function head(root, n, title, px, cls = '') {
    KHC.hud(root, 'KHC AWARDS · S7', []);
    const a = el('div', 'award ' + cls, root);
    el('div', 'n', a, `PRÊMIO Nº ${String(n).padStart(2, '0')}`);
    const t = el('div', 't', a, title);
    const p = el('div', 'px', a, px);
    return { a, t, p };
}
function drawHead(h, lt) {
    const p = enter(lt, .1, .45, ease.back);
    set(h.t, { o: Math.min(1, p * 2), x: (1 - p) * -200 });
    set(h.p, { o: lt > .4 ? (lt < 1.2 ? blink(lt, .15) : 1) : 0 });
}
function row(parent, name, tier, sub, value, cls = '') {
    const r = KHC.teamRow(parent, { name, avatar: T(name, tier).avatar, sub, value });
    if (cls) r.row.classList.add(...cls.split(' '));
    return r;
}
function slideIn(r, t, a, from = 1100) { const p = enter(t, a, .35); set(r.row, { o: Math.min(1, p * 1.6), x: (1 - p) * from }); }
function count(elm, t, a, b, v, digits = 2) { elm.textContent = (v * ease.out(prog(t, a, b))).toFixed(digits); }

/** Prêmio de 4 s com dois times: entram (+.35), placares (+.4→1.2), selo (+1.4), legenda (+1.8). */
function duel(a, n, title, px, A1, B1, cfg) {
    KHC.scene(a, a + 4, root => {
        const s = root.s = {};
        s.h = head(root, n, title, px);
        const g = el('div', 'group', root); g.style.top = (cfg.top || 620) + 'px'; g.style.gap = '40px';
        s.a = row(g, ...A1); s.b = row(g, ...B1);
        s.st = KHC.stamp((cfg.stampOn === 'b' ? s.b : s.a).row, cfg.stamp, { top: -56, right: 24, rot: -3 });
        if (cfg.extra) cfg.extra(root, s);
        s.cap = KHC.caption(root, cfg.caption[0], cfg.caption[1]);
    }, (lt, t, root) => {
        const s = root.s;
        drawHead(s.h, lt);
        slideIn(s.a, t, a + .35); slideIn(s.b, t, a + .5, -1100);
        if (cfg.va !== undefined) count(s.a.val, t, a + .4, a + 1.2, cfg.va);
        if (cfg.vb !== undefined) count(s.b.val, t, a + .4, a + 1.2, cfg.vb);
        KHC.drawStamp(s.st, t, a + 1.4);
        if (cfg.drawExtra) cfg.drawExtra(t, s);
        KHC.drawCaption(s.cap, t, a + 1.8);
    });
}

// ================================================================ CENAS
// 0–3 · Abertura
KHC.scene(0, 3, root => {
    const s = root.s = {};
    s.logo = el('img', 'big-logo', root); s.logo.src = LEAGUE.khc.crest;
    s.px = el('div', 'awards-px', root, 'KHC AWARDS');
    s.l1 = el('div', 'open-l', root, 'Prêmios que'); s.l1.style.top = '800px';
    s.l2 = el('div', 'open-l', root, 'ninguém'); s.l2.style.top = '910px';
    s.l3 = el('div', 'open-l o', root, 'queria'); s.l3.style.top = '1020px';
    s.l4 = el('div', 'open-l o', root, 'ganhar.'); s.l4.style.top = '1130px';
    s.chip = el('div', 'week-chip', root, 'SEMANA 7');
    s.sub = el('div', 'open-sub', root, 'Teve lag, teve lâmina e teve Bola de Ouro.');
    s.boot = el('div', 'boot', root);
}, (lt, t, root) => {
    const s = root.s;
    const b = prog(lt, 0, .16);
    set(s.boot, { o: 1 - b, sy: lerp(.004, 1, ease.out(b)) });
    const lp = enter(lt, .05, .6, ease.elastic); set(s.logo, { s: lp, r: (1 - lp) * 20 });
    set(s.px, { o: lt < 1.2 ? blink(lt, .15) : 1 });
    [s.l1, s.l2, s.l3, s.l4].forEach((e, i) => { const p = enter(lt, .25 + i * .16, .35, ease.back); set(e, { o: Math.min(1, p * 2), y: (1 - p) * 80 }); });
    const c = enter(lt, 1.2, .3, ease.back); set(s.chip, { o: c, s: lerp(1.6, 1, c) });
    const sb = enter(lt, 1.7, .4); set(s.sub, { o: sb, y: (1 - sb) * 30 });
});

// 3–9,5 · Desculpa do Ano: LAG (Série C · a rivalidade máxima da Prévia)
const SA = pts('San Andreas Chiefs', 'serie-c'), JW = pts('joaoW7', 'serie-c');
/** Placar "online": anda normal, trava, dá rubber-band e teleporta pro final. */
function lagScore(lt, fin, lead) {
    const step = (x, d) => Math.floor(x / d) * d;
    if (lt < .35) return 0;
    if (lt < 1.0) return lead * ease.out(prog(lt, .35, 1.0));
    if (lt < 2.65) {
        const k = step(lt, .18);                       // quadros travados
        if (fin < lead + 30 && lt > 1.45 && lt < 1.85) return lead + 44;   // rubber-band do San Andreas
        return lead + (k - 1.0) * 3;
    }
    return fin;
}
KHC.scene(3, 9.5, root => {
    const s = root.s = {};
    s.g = el('div', 'game', root);
    const top = el('div', 'g-top', s.g);
    el('div', 'g-live', top, 'AO VIVO · RANKED');
    s.ping = el('div', 'ping', top, '<div class="wifi"><i style="height:25%"></i><i style="height:50%"></i><i style="height:75%"></i><i style="height:100%"></i></div><span>38 ms</span>');
    s.pingT = s.ping.querySelector('span'); s.bars = [...s.ping.querySelectorAll('i')];
    s.title = el('div', 'g-title', s.g, 'SÉRIE C · 1º × 2º');
    el('div', 'g-sub', s.g, 'PRÊMIO Nº 01 · DESCULPA DO ANO');
    const bd = el('div', 'board', s.g);
    const side = (cls, n, nm) => {
        const d = el('div', 'side ' + cls, bd);
        el('img', '', d).src = T(n, 'serie-c').avatar;
        el('div', 'nm', d, nm);
        d.sc = el('div', 'sc', d, '0.00');
        d.tag = el('div', 'tag', d, cls === 'l' ? 'DERROTA' : 'VITÓRIA');
        return d;
    };
    s.l = side('l', 'San Andreas Chiefs', 'San Andreas'); s.r = side('r', 'joaoW7', 'joaoW7');
    el('div', 'g-vs', bd, 'VS');
    s.warn = el('div', 'warn', s.g, '<div class="spin"></div>CONEXÃO INSTÁVEL');
    s.spin = s.warn.querySelector('.spin');
    s.reco = el('div', 'reco', s.g, '<div class="lb">RECONECTANDO…</div><div class="bar"><i></i></div>');
    s.recoI = s.reco.querySelector('i'); s.recoL = s.reco.querySelector('.lb');
    const chat = el('div', 'chat', s.g);
    s.msgs = [[1.2, '<b>ferpetucco:</b> LAAAG!!!'], [1.65, '<b>ferpetucco:</b> 999 de ping, impossível'],
              [2.95, '<b class="j">joaoW7:</b> gg ez'], [3.3, '<b>ferpetucco:</b> foi a internet, juro']].map(([at, h]) => {
        const m = el('div', 'msg', chat, h); m.at = at; return m;
    });
    s.pix = el('div', 'pix', s.g);
    s.tears = [0, 1, 2].map(i => el('div', 'tear', s.g));
    s.st = KHC.stamp(s.g, 'Desculpa oficial: LAG', { top: 990, right: 250, rot: -4 }); s.st.style.fontSize = '44px';
    s.cap = KHC.caption(root, 'Caiu o invicto, por 12.06.', 'E o joaoW7 passou ele no Power Ranking.');
    s.cap.c.style.top = '1610px';
}, (lt, t, root, wall) => {
    const s = root.s;
    const lag = lt > 1.0 && lt < 2.65;
    // ping e wi-fi
    const ping = lt < 1.0 ? 38 + Math.round(Math.sin(wall * 9) * 4) : lag ? 999 : 41;
    s.pingT.textContent = ping + ' ms';
    s.ping.style.color = lag ? (blink(wall, .15) ? '#ff4d4d' : '#ffb3ab') : 'var(--ok)';
    s.bars.forEach((b, i) => { b.style.opacity = lag ? (i === 0 ? 1 : .15) : 1; });
    // placares
    s.l.sc.textContent = lagScore(lt, SA, 96).toFixed(2);
    s.r.sc.textContent = lagScore(lt, JW, 88).toFixed(2);
    const done = lt >= 2.65;
    s.l.sc.style.color = done ? '#ff6b5e' : '#fff'; s.r.sc.style.color = done ? 'var(--ok)' : '#fff';
    [s.l.tag, s.r.tag].forEach(tg => { const p = enter(lt, 2.7, .22, ease.back); set(tg, { o: p, s: lerp(2, 1, p) }); });
    // alerta e reconexão (trava em 99%)
    set(s.warn, { o: lag ? 1 : (done ? 1 - prog(lt, 2.65, 2.9) : 0) });
    s.spin.style.transform = `rotate(${wall * 720}deg)`;
    set(s.reco, { o: lt > 1.3 && lt < 2.9 ? 1 : 0 });
    s.recoI.style.width = Math.min(99, 99 * ease.out(prog(lt, 1.3, 2.1))) + '%';
    s.recoL.textContent = lt < 2.65 ? `RECONECTANDO… ${Math.round(Math.min(99, 99 * ease.out(prog(lt, 1.3, 2.1))))}%` : 'CONECTADO · PARTIDA ENCERRADA';
    s.msgs.forEach(m => { const p = enter(lt, m.at, .2); set(m, { o: p, x: (1 - p) * -60 }); });
    // falhas de imagem durante o lag
    const j = lag ? Math.floor(lt / .09) : 0;
    const bd = s.g.querySelector('.board');
    bd.style.transform = lag ? `translate(${(j * 37 % 23) - 11}px, ${(j * 53 % 15) - 7}px)` : 'none';
    bd.style.filter = lag ? `blur(${(j % 3) * 1.5}px) contrast(1.3) ${j % 4 === 0 ? 'hue-rotate(120deg)' : ''}` : 'none';
    s.pix.style.opacity = lag ? .5 + (j % 2) * .3 : 0;
    s.tears.forEach((tr, i) => { tr.style.opacity = lag && (j + i) % 3 === 0 ? .8 : 0; tr.style.top = (420 + ((j * 131 + i * 241) % 560)) + 'px'; });
    KHC.drawStamp(s.st, t, 3 + 3.4);
    KHC.drawCaption(s.cap, t, 3 + 3.7);
});

// 9,5–13,5 · Caçador de Donos: Diogoashura × os dois donos
duel(9.5, 2, 'Caçador de Donos', 'DIOGOASHURA · ELITE E SÉRIE A',
    ['Diogoashura', 'elite', 'Elite · bateu o Public Enemy · 4º', '0.00', 'win'],
    ['Diogoashura', 'serie-a', 'Série A · lanterna · <span class="q">76% queda</span>', '0.00', 'lose'],
    { va: pts('Diogoashura', 'elite'), vb: pts('Diogoashura', 'serie-a'),
      stamp: 'Humilhou um dono. Apanhou do outro.',
      caption: ['Public Enemy levou 51.8 e saiu do G4 (44%).', 'O Ditador: 5–2 e só #13 no Power Ranking.'] });

// 13,5–17,5 · Vigarista
duel(13.5, 3, 'Sem Plano Infalível', 'O VIGARISTA · SÉRIE A',
    ['Caipiracicaba', 'serie-a', `<span class="nick">"o Vigarista"</span> · ${rec('Caipiracicaba', 'serie-a')} · <span class="q">74% queda</span>`, '0.00', 'lose'],
    ['Timbatível', 'serie-a', `venceu · ${rec('Timbatível', 'serie-a')}`, '0.00', 'win'],
    { va: pts('Caipiracicaba', 'serie-a'), vb: pts('Timbatível', 'serie-a'),
      stamp: 'Nem a edição salva', caption: ['Perdeu de novo, por 25.', '74% de queda. Plano infalível? Só na edição.'] });

// 17,5–21,5 · Série B · as Gordinhas não param

const BLADE = `<svg viewBox="0 0 1000 200" preserveAspectRatio="none"><rect x="470" y="0" width="60" height="40" fill="#2b2724"/>
  <polygon points="0,30 1000,30 1000,110 0,200" fill="#6d6762"/><polygon points="0,182 1000,96 1000,110 0,200" fill="#B3121B"/></svg>`;
function sliced(parent, fill) {
    const s = el('div', 'slot', parent);
    const top = el('div', 'half top', s), bot = el('div', 'half bot', s);
    fill(top); fill(bot);
    const line = el('div', 'cutl', s);
    const bl = el('div', 'blade', s, BLADE); bl.style.top = '-130px';
    return { s, top, bot, line, bl };
}
function drawSlice(sl, t, a) {
    const p = enter(t, a, .3, ease.back), g = prog(t, a, a + .3);
    const f = `grayscale(${g}) brightness(${1 - .4 * g})`;
    set(sl.top, { x: -p * 16, y: -p * 10, r: -p * 1.2, f }); set(sl.bot, { x: p * 16, y: p * 10, r: p * 1.4, f });
    sl.line.style.opacity = t < a - .08 ? 0 : 1 - prog(t, a + .05, a + .45);
    sl.line.style.transform = `rotate(-1.4deg) scaleX(${prog(t, a - .08, a)})`;
    const d = ease.inOut(prog(t, a - .2, a)), up = prog(t, a + .1, a + .45);
    set(sl.bl, { o: t < a - .2 || t > a + .45 ? 0 : 1 - up, y: lerp(-800, 0, d) - up * 60 });
}
KHC.scene(29.5, 34.5, root => {
    const s = root.s = {};
    el('div', 'redbg', root);
    s.h = head(root, 7, 'Guilhotina', `RODADA 7 · ${G.alive} VIVOS`, 'red');
    const g = el('div', 'group', root); g.style.top = '600px'; g.style.gap = '0';
    const cut = GT(W7.cut);
    const alive = G.teams.filter(x => !x.cut || x.name === cut.name).sort((a, b) => b.fpts - a.fpts);
    const rank = alive.indexOf(cut) + 1;
    s.cut = sliced(g, h => { const r = KHC.teamRow(h, { name: cut.name, avatar: cut.avatar, sub: `${rank}º maior PF da liga`, value: br(W7.cut_pts) }); r.row.classList.add('lose'); });
    s.rip = el('div', 'rip', s.cut.s, 'CORTADO');
    s.roast = el('div', 'roast', g, `Tinha a ${rank}ª maior pontuação. Não importa.`);
    const esc = W7.escaped[0];
    s.esc = KHC.teamRow(g, { name: esc.name, avatar: GT(esc.name).avatar, sub: `escapou por ${br(esc.pts - W7.cut_pts)}`, value: br(esc.pts) });
    s.esc.row.classList.add('hot');
    s.st = KHC.stamp(s.esc.row, 'Na nossa enquete. Escapou.', { top: -56, right: 24, rot: -3 });
    s.fl = el('div', 'flash', root);
    s.cap = KHC.caption(root, 'A enquete errou de novo.', 'A lâmina não lê enquete.');
}, (lt, t, root) => {
    const s = root.s;
    drawHead(s.h, lt);
    const e = enter(t, 29.9, .35); set(s.cut.s, { o: Math.min(1, e * 1.6), x: (1 - e) * -1100 });
    drawSlice(s.cut, t, 30.8);
    const q = enter(t, 30.85, .2); set(s.rip, { o: q, s: lerp(2, 1, q), r: -6 });
    const r = enter(t, 31.1, .35, ease.back); set(s.roast, { o: r, s: lerp(1.4, 1, r) });
    slideIn(s.esc, t, 31.5);
    KHC.drawStamp(s.st, t, 32.0);
    s.fl.style.opacity = t >= 30.8 ? .55 * (1 - prog(t, 30.8, 31.1)) : 0;
    const [x, y] = shake(t, 30.8, .3, 16); root.style.transform = `translate(${x}px, ${y}px)`;
    KHC.drawCaption(s.cap, t, 32.4);
});
